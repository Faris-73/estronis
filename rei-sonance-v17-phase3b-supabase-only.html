<style>
:root{
  --bg:#0b0b0d; --panel:#151517; --panel-2:#1c1c1f; --border:#2a2a2e;
  --gold:#c9a24b; --gold-soft:#8d743a; --text:#e9e6df; --muted:#9a978f; --muted-2:#706d66;
  --red:#a4483a; --green:#5c7a5e; --blue:#4d6b8a; --purple:#7a5c8a; --orange:#b3773a;
}
*{box-sizing:border-box;}
:root{ --base-font:15px; --font-scale:1; }
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;font-size:var(--base-font);zoom:var(--font-scale,1);}
body.density-compact .panel{padding:12px;}
body.density-compact .item-card{padding:9px 12px;}
body.density-compact .page-body{padding-top:36px;padding-bottom:36px;}
body.density-compact .form-grid{gap:8px;}
body.density-compact .card-list{gap:6px;}
body.density-compact .quick-btn{padding:12px 6px;}
/* custom toggle switch (replaces native checkboxes for on/off settings) */
.tswitch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;cursor:pointer;}
.tswitch input{opacity:0;width:0;height:0;position:absolute;}
.tswitch .track{position:absolute;inset:0;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;transition:.2s;}
.tswitch .knob{position:absolute;top:2px;left:3px;width:18px;height:18px;background:var(--muted);border-radius:50%;transition:.2s;}
.tswitch input:checked + .track{background:rgba(201,162,75,.18);border-color:var(--gold-soft);}
.tswitch input:checked + .track .knob{transform:translateX(20px);background:var(--gold);}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);gap:14px;}
.setting-row:last-child{border-bottom:none;}
.setting-row .lbl{font-size:13.5px;color:var(--text);}
.setting-row .sub{font-size:11.5px;color:var(--muted-2);margin-top:2px;}
/* custom themed dropdown (replaces native <select> for filters) */
.cdd{position:relative;display:inline-block;}
.cdd-trigger{background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;user-select:none;}
.cdd-trigger:hover{border-color:var(--gold-soft);}
.cdd-trigger .arrow{font-size:9px;color:var(--muted);transition:transform .2s;}
.cdd.open .cdd-trigger{border-color:var(--gold-soft);}
.cdd.open .cdd-trigger .arrow{transform:rotate(180deg);}
.cdd-menu{position:fixed;min-width:170px;max-height:260px;overflow-y:auto;background:var(--panel);border:1px solid var(--gold-soft);border-radius:9px;z-index:70;display:none;box-shadow:0 12px 34px rgba(0,0,0,.55);}
.cdd.open .cdd-menu{display:block;}
.cdd-opt{padding:9px 13px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.cdd-opt:hover{background:var(--panel-2);color:var(--text);}
.cdd-opt.selected{color:var(--gold);background:var(--panel-2);}
::selection{background:var(--gold-soft);color:#0b0b0d;}
button,input,select,textarea{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
.sidebar{width:230px;flex-shrink:0;background:#0e0e10;border-left:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{font-family:'Cinzel',serif;font-size:19px;font-weight:700;color:#f2ead2;display:flex;align-items:center;justify-content:space-between;cursor:pointer;letter-spacing:.5px;}
.searchbox{position:relative;}
.searchbox input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;}
.searchbox input:focus{border-color:var(--gold-soft);}
.search-results{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#0e0e10;border:1px solid var(--gold-soft);border-radius:8px;max-height:280px;overflow-y:auto;z-index:50;display:none;}
.search-results.show{display:block;}
.search-results .sr-item{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--border);cursor:pointer;color:var(--muted);}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item:hover{background:var(--panel-2);color:var(--text);}
.search-results .sr-item b{color:var(--gold);font-weight:600;}
nav.navlist{display:flex;flex-direction:column;gap:2px;}
/* ---- micro-interactions: press feedback + smooth transitions on interactive elements ---- */
.navitem, .quick-btn, .item-card, .btn-gold, .btn-ghost, .btn-danger, .btn-sm, .del-btn, .type-tab, .update-card,
.gal-card, .tl-item, .activity-row, .theme-swatch, .edit-btn, .cdd-trigger, .checkitem, .mini-item, .dash-row{
  transition: transform .12s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}
@media (hover:hover){
  .navitem:hover, .type-tab:hover, .edit-btn:hover{ background:var(--panel-2); }
  .item-card:hover, .update-card:hover, .gal-card:hover, .tl-item:hover, .theme-swatch:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .quick-btn:hover{ transform:translateY(-2px); }
  .btn-gold:hover{ filter:brightness(1.08); }
}
.navitem:active, .quick-btn:active, .item-card:active, .btn-gold:active, .btn-ghost:active, .btn-danger:active,
.btn-sm:active, .del-btn:active, .type-tab:active, .update-card:active, .gal-card:active, .tl-item:active,
.activity-row:active, .theme-swatch:active, .edit-btn:active, .cdd-trigger:active, .mini-item:active, .dash-row:active{
  transform: scale(0.97);
  opacity:.9;
}
.quick-btn:active{ transform: scale(0.94) translateY(0); }

.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;user-select:none;}
.navitem:hover{background:var(--panel-2);color:var(--text);}
.navitem.active{background:var(--panel-2);color:var(--gold);}
.navitem .ic{width:18px;text-align:center;font-size:14px;}
.navdivider{height:1px;background:var(--border);margin:4px 0;}
.quote-card{background:var(--panel);border:1px solid var(--gold-soft);border-radius:10px;padding:14px 12px;position:relative;}
.quote-card p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;line-height:1.7;color:#dcd6c4;margin:0 0 6px 0;text-align:center;}
.quote-card .by{text-align:center;font-size:11px;color:var(--gold);}
.dash-title{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;text-align:center;}
.dash-list{display:flex;flex-direction:column;gap:3px;}
.dash-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:5px 8px;border-radius:6px;cursor:pointer;}
.dash-row:hover{background:var(--panel-2);color:var(--text);}
.dash-row .lbl{display:flex;align-items:center;gap:7px;}
.dash-row .count{background:var(--panel-2);color:var(--text);font-weight:700;min-width:20px;text-align:center;border-radius:6px;padding:1px 6px;font-size:11.5px;}

/* mobile topbar */
.topbar{display:none;position:sticky;top:0;z-index:40;background:#0e0e10;border-bottom:1px solid var(--border);padding:12px 16px;align-items:center;justify-content:space-between;}
.topbar .brand{font-size:16px;}
.hamburger{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:16px;cursor:pointer;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;}
.sidebar-backdrop.show{display:block;}

/* ---------- main ---------- */
main.content{flex:1;min-width:0;}
.banner{position:relative;height:210px;width:100%;background:linear-gradient(180deg,rgba(10,10,12,.15),rgba(10,10,12,.92)),url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?fm=jpg&q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;}
.logo-box{position:absolute;bottom:-42px;right:32px;width:100px;height:100px;background:#0e0e10;border:1.5px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.logo-box span{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:#f2ead2;line-height:1.3;letter-spacing:1px;}
.page-body{max-width:1080px;margin:0 auto;padding:60px 28px 60px;}
h1.title{font-family:'Cinzel',serif;font-size:27px;font-weight:700;color:#f2ead2;margin:0 0 8px;letter-spacing:.5px;}
p.tagline{color:var(--muted);font-size:14px;line-height:1.9;margin:0 0 16px;max-width:640px;}
.divider-orn{display:flex;align-items:center;gap:12px;color:var(--gold);margin:18px 0 30px;}
.divider-orn .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);}
h2.section-h{font-family:'Cinzel',serif;color:var(--gold);font-size:15px;font-weight:600;letter-spacing:.4px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;}
h2.section-h.left{justify-content:flex-start;text-align:right;}
h3.sub-h{font-family:'Cinzel',serif;color:var(--gold);font-size:13.5px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:7px;}

.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:40px;}
.quick-btn{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
.quick-btn:hover{border-color:var(--gold-soft);background:var(--panel-2);}
.quick-btn .ic{font-size:20px;}
.quick-btn .lbl{font-size:12.5px;color:var(--text);font-weight:500;text-align:center;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:40px;align-items:start;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;}
table.info-tbl{width:100%;border-collapse:collapse;}
table.info-tbl tr{border-bottom:1px solid var(--border);}
table.info-tbl tr:last-child{border-bottom:none;}
table.info-tbl td{padding:10px 4px;font-size:13.5px;}
table.info-tbl td:first-child{color:var(--muted);width:38%;}
table.info-tbl td:last-child{color:var(--text);font-weight:500;}
.status-pill{background:rgba(201,162,75,.15);color:var(--gold);border:1px solid var(--gold-soft);border-radius:6px;padding:2px 10px;font-size:12px;display:inline-block;}
.eclipse{margin-top:14px;height:120px;border-radius:10px;border:1px solid var(--border);background:radial-gradient(circle at center,#050506 0 24px,transparent 25px),conic-gradient(from 0deg,transparent 0 88deg,var(--gold) 88deg 92deg,transparent 92deg 178deg,var(--gold) 178deg 182deg,transparent 182deg 268deg,var(--gold) 268deg 272deg,transparent 272deg 358deg,var(--gold) 358deg 360deg),radial-gradient(circle at center,transparent 0 52px,#0e0e10 53px);background-color:#0e0e10;}

.updates-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.update-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;}
.update-card:hover{border-color:var(--gold-soft);}
.update-card .ic{font-size:16px;margin-top:1px;}
.update-card .t{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
.update-card .d{font-size:12px;color:var(--muted-2);}
.update-card.wide{grid-column:1/-1;}
.footer-quote{margin-top:40px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 24px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;color:#dcd6c4;font-size:15px;line-height:1.8;}

textarea.notes-area{width:100%;min-height:70px;resize:vertical;background:transparent;border:none;color:var(--text);font-size:13.5px;outline:none;line-height:1.8;}
.page-textarea{width:100%;min-height:130px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-size:14px;line-height:1.9;outline:none;resize:vertical;}
/* rich text editor (Bold/Italic/Bullet/Subheading) */
.rte-wrap{width:100%;}
.rte-toolbar{display:flex;gap:4px;margin-bottom:6px;}
.rte-toolbar button{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:6px;width:30px;height:28px;font-size:12.5px;cursor:pointer;}
.rte-toolbar button:hover{color:var(--gold);border-color:var(--gold-soft);}
.rte-toolbar-header{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:var(--muted);font-size:11.5px;margin-bottom:6px;padding:2px 0;}
.rte-toolbar-header:hover{color:var(--gold);}
.rte-toolbar-header .rte-toolbar-arrow{font-size:9px;transition:transform .15s;}
.rte-editor{min-height:100px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;line-height:1.8;outline:none;overflow-y:auto;}
.rte-editor:focus{border-color:var(--gold-soft);}
.rte-editor.big{min-height:150px;background:var(--panel);padding:14px 16px;font-size:14px;line-height:1.9;}
.rte-editor:empty:before{content:attr(data-placeholder);color:var(--muted-2);}
.rte-editor ul{margin:6px 0;padding-inline-start:22px;}
.rte-editor h4{color:var(--gold);font-size:1.05em;margin:8px 0 4px;font-family:'Cinzel',serif;}
.rte-editor b,.rte-editor strong{color:var(--text);}
.auto-textarea{min-height:100px;resize:vertical;width:100%;box-sizing:border-box;overflow-y:hidden;}
.field textarea.auto-textarea{min-height:100px;}
.page-textarea:focus{border-color:var(--gold-soft);}
.save-hint{font-size:11.5px;color:var(--muted-2);margin-top:5px;}

/* toolbar / filters */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px;}
.filters{display:flex;flex-wrap:wrap;gap:8px;}
.filters select, .filters input{background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:12.5px;outline:none;}
.btn-gold{background:var(--gold);color:#1a1409;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;}
.btn-ghost:hover{color:var(--text);border-color:var(--gold-soft);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}

/* forms */
.form-card{background:var(--panel);border:1px solid var(--gold-soft);border-radius:10px;padding:18px;margin-bottom:20px;}
.form-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.form-tab{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;}
.form-tab.active{color:var(--gold);border-color:var(--gold-soft);background:rgba(201,162,75,.08);}
.form-section{display:none;}
.form-section.active{display:block;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.field{}
.field.full{grid-column:1/-1;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-soft);}
.field textarea{min-height:56px;resize:vertical;}
.field img.preview{max-width:100%;max-height:100px;min-height:100px;border-radius:8px;margin-top:6px;border:1px solid var(--border);}
.file-upload-row{display:flex;align-items:center;gap:10px;}
.file-name-hint{font-size:11.5px;color:var(--muted-2);}
.img-upload-zone{border:2px dashed var(--border);border-radius:10px;padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;box-sizing:border-box;width:100%;}
.img-upload-zone:hover{border-color:var(--gold-soft);background:var(--panel-2);}
.img-upload-zone .iz-icon{font-size:28px;margin-bottom:6px;}
.img-upload-zone .iz-label{font-weight:600;font-size:13.5px;color:var(--text);margin-bottom:4px;}
.img-upload-zone .iz-hint{font-size:11.5px;color:var(--muted-2);}
.img-upload-filled{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;box-sizing:border-box;}
.img-upload-filled img.preview{max-width:100%;max-height:160px;min-height:160px;margin-top:0;border-radius:8px;border:1px solid var(--border);object-fit:cover;}
.checkgrid{display:flex;flex-wrap:wrap;gap:8px;}
.checkitem{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;}
.checkitem input{accent-color:var(--gold);}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;width:100%;box-sizing:border-box;}
.chip-item{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:background .15s,border-color .15s,color .15s;user-select:none;max-width:100%;}
.chip-item:hover{border-color:var(--gold-soft);}
.chip-item.chip-selected{background:var(--gold);border-color:var(--gold);color:#1a1409;font-weight:700;}
.chip-item.chip-selected::before{content:'✓ ';}
.chip-item .chip-thumb{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.chip-item input{display:none;}
.form-actions{display:flex;gap:10px;}
.addcat-row{display:flex;gap:8px;margin-top:8px;}
.addcat-row input{flex:1;}

/* cards / lists */
.card-list{display:flex;flex-direction:column;gap:9px;}
.item-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;cursor:pointer;}
.item-card:hover{border-color:var(--gold-soft);}
.item-card .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
.item-card .main{flex:1;min-width:0;display:flex;gap:12px;}
.item-card .name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.item-card .name{font-weight:700;font-size:14.5px;color:var(--text);}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
.tag.gold{color:var(--gold);border-color:var(--gold-soft);background:rgba(201,162,75,.08);}
.tag.status-ns{color:#9a978f;} .tag.status-wip{color:var(--orange);border-color:var(--orange);}
.tag.status-done{color:var(--green);border-color:var(--green);} .tag.status-paused{color:var(--blue);border-color:var(--blue);}
.tag.status-cancel{color:var(--red);border-color:var(--red);}
.item-card .meta{font-size:12px;color:var(--muted-2);margin-bottom:3px;}
.item-card .desc{font-size:12.5px;color:var(--muted);line-height:1.6;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.del-btn{background:transparent;border:none;color:var(--muted-2);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;flex-shrink:0;}
.del-btn:hover{color:var(--red);background:rgba(164,72,58,.1);}
.empty-state{text-align:center;padding:44px 20px;color:var(--muted-2);font-size:13.5px;border:1px dashed var(--border);border-radius:10px;}
.empty-state-rich{text-align:center;padding:50px 24px;border:1px dashed var(--border);border-radius:12px;}
.empty-state-rich .es-ic{font-size:38px;margin-bottom:14px;}
.empty-state-rich .es-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty-state-rich .es-sub{font-size:13px;color:var(--muted-2);margin-bottom:18px;line-height:1.7;max-width:340px;margin-left:auto;margin-right:auto;}

/* ================= WRITING MODE (additive — does not alter any existing rule above) ================= */
.writing-page{max-width:1400px;}
.writing-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.writing-toolbar-right{display:flex;gap:8px;}
.writing-layout{display:flex;gap:16px;align-items:flex-start;}
.writing-sidebar{width:230px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.writing-sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);}
.writing-add-btn{cursor:pointer;color:var(--gold);font-weight:700;padding:0 4px;}
.writing-add-btn:hover{color:var(--text);}
.writing-chapter-list{max-height:560px;overflow-y:auto;padding:6px;}
.writing-chapter-item{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;}
.writing-chapter-item:hover{background:var(--panel-2);}
.writing-chapter-item.active{background:var(--panel-2);border:1px solid var(--gold-soft);}
.writing-chapter-item .wci-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.writing-chapter-item .wci-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);margin-top:3px;}
.writing-main{flex:1;min-width:0;}
.writing-chapter-head{margin-bottom:10px;}
.writing-chapter-head .wch-badge{font-size:14px;font-weight:700;color:var(--text);}
.writing-preview{white-space:normal;}
.writing-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.writing-stats b{color:var(--text);}
.writing-ref{width:260px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;max-height:640px;overflow-y:auto;}
.writing-ref-block{margin-bottom:16px;}
.writing-ref-block h4{font-size:12px;color:var(--gold);margin-bottom:6px;}
.writing-ref-block p{font-size:12.5px;color:var(--muted);line-height:1.7;}
.writing-ref-scene{font-size:12px;color:var(--muted);margin-bottom:6px;}
.writing-ref-scene b{color:var(--text);}
@media (max-width:1100px){ .writing-ref{display:none;} }
@media (max-width:880px){ .writing-sidebar{display:none;} }

/* Focus mode: pure CSS layout change — never touches the editor DOM node itself */
body.writing-focus-mode .sidebar,
body.writing-focus-mode .topbar,
body.writing-focus-mode .banner{display:none !important;}
body.writing-focus-mode .content{padding-top:0;}
body.writing-focus-mode .writing-ref,
body.writing-focus-mode .writing-sidebar{display:none !important;}
body.writing-focus-mode .page-body.writing-page{max-width:900px;padding-top:28px;}

/* modal detail */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
.modal-backdrop.show{display:flex;}
.modal-box{background:var(--panel);border:1px solid var(--gold-soft);border-radius:14px;max-width:680px;width:100%;padding:26px;position:relative;}
.modal-close{position:absolute;top:14px;left:14px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;}
.modal-close:hover{color:var(--text);}
.modal-box h2{font-family:'Cinzel',serif;color:var(--gold);font-size:19px;margin:0 0 4px;}
.modal-img{width:100%;max-height:220px;min-height:220px;object-fit:cover;border-radius:10px;margin-bottom:14px;border:1px solid var(--border);cursor:zoom-in;}
/* lightbox: fullscreen image viewer with zoom/pan */
.lightbox-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
.lightbox-backdrop.show{display:flex;}
.lightbox-img{max-width:92vw;max-height:80vh;cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none;}
.lightbox-controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:201;}
.lightbox-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;width:42px;height:42px;font-size:17px;cursor:pointer;backdrop-filter:blur(6px);}
.lightbox-btn:active{transform:scale(.92);}
.lightbox-close{position:fixed;top:16px;left:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer;z-index:201;}
.gal-card img{cursor:zoom-in;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:14px 0;}
.modal-field{padding:8px 0;border-bottom:1px solid var(--border);}
.modal-field.full{grid-column:1/-1;}
.modal-field .l{font-size:11.5px;color:var(--muted-2);margin-bottom:3px;}
.modal-field .v{font-size:13.5px;color:var(--text);line-height:1.7;white-space:pre-wrap;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.related-block{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
.related-block h4{font-size:12.5px;color:var(--gold);margin:0 0 8px;display:flex;align-items:center;gap:6px;}
.related-chip{display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;margin:0 6px 6px 0;color:var(--text);}

/* accordion (world) */
.accordion{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--panel);}
.acc-head{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:14px;font-weight:600;}
.acc-head:hover{background:var(--panel-2);}
.acc-head .cnt{font-size:11.5px;color:var(--muted-2);font-weight:400;}
.acc-body{display:none;padding:0 16px 16px;}

<script>

/* ================= STATE / STORAGE ================= */
const DEFAULTS = {

  homeSections:{banner:true, logo:true, quickaccess:true, overview:true, author:true, stats:true, activity:true, quicknotes:true, quote:true},

    {id:'c7',label:'الفصول',checked:false},{id:'c8',label:'التناقضات',checked:false},{id:'c9',label:'التلميحات',checked:false},

  quickNotesList:[],
  sagas:[], scenes:[],
  worldInfo:[
    {label:'اسم العالم',value:''},{label:'معنى الاسم',value:''},{label:'عمر العالم',value:''},
    {label:'حجم العالم',value:''},{label:'شكل العالم',value:''},{label:'عدد القارات',value:''},
    {label:'عدد المحيطات',value:''},{label:'عدد البحار',value:''},{label:'عدد الأقمار',value:''},
    {label:'المناخ',value:''},{label:'شكل السماء',value:''},{label:'الليل والنهار',value:''},
    {label:'الجاذبية',value:''},{label:'قوانين الطبيعة',value:''},{label:'قوانين العالم الخاصة',value:''},
    {label:'معلومات إضافية',value:''}
  ],
  geo:{continents:[],seas:[],oceans:[],deserts:[],mountains:[],forests:[],caves:[],rivers:[],islands:[],forbidden:[],legendary:[]},
  kingdoms:[], organizations:[],
  characters:[], charCategories:['⭐ البطل','👿 الشرير','🛡️ داعم','👤 ثانوي','⚔️ منافس','🧑‍🏫 معلم','👑 حاكم','🏛️ قائد','🕵️ غامض','👹 شخصية معادية','❓ أخرى'],
  places:[],
  powerSources:[], laws:[], ranks:[], elements:[], elementCategories:['🔥 النار','💧 الماء','🌍 الأرض','💨 الهواء','⚡ البرق','❄️ الثلج'],
  abilities:[], techniques:[], weapons:[],
  mainIdea:'', arcs:[], chapters:[], storyLog:[],
  ideas:[], designs:[], history:[],
  guide:{message:'',rules:[],contradictions:[],checklist:[],quotes:[],notes:'',secrets:[],reminders:[]},
};
let STATE = JSON.parse(JSON.stringify(DEFAULTS));
let saveTimers = {};

/* ================= STORAGE LAYER ================= */
/* Priority: IndexedDB (primary, large quota, transactional) → window.storage (Claude
   artifact env) → localStorage (last-resort fallback). Legacy sources are never deleted —
   only migrated from, once, on first run. */
const SCHEMA_VERSION = 1;
const IDB_NAME = 'ReiSonanceDB';
const IDB_VERSION = 2; /* v2: adds the 'images' object store (Blob storage) alongside the existing 'appState' store. appState is untouched by this upgrade. */
const IDB_STORE = 'appState';
const IDB_IMAGES_STORE = 'images';
const HAS_INDEXEDDB = (typeof indexedDB !== 'undefined');
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const LS_PREFIX = 'rei_sonance_';
let idbInstance = null;
let idbBroken = false; /* flips true only if IndexedDB throws unexpectedly at runtime */

function openIDB(){
  return new Promise((resolve, reject)=>{
    if(!HAS_INDEXEDDB){ reject(new Error('IndexedDB not supported in this browser')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      /* Never touch appState here — only ever add stores, never recreate/delete existing ones. */
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'key'});
      if(!db.objectStoreNames.contains(IDB_IMAGES_STORE)) db.createObjectStore(IDB_IMAGES_STORE, {keyPath:'id'});
    };
    req.onsuccess = e=> resolve(e.target.result);
    req.onerror = ()=> reject(req.error || new Error('IndexedDB open failed'));
  });
}
async function getIDB(){
  if(idbInstance) return idbInstance;
  idbInstance = await openIDB();
  return idbInstance;
}
function idbGet(key){
  return getIDB().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result ? req.result.value : undefined);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbSet(key, value){
  return getIDB().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({key, value});
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
    tx.onabort = ()=> reject(tx.error || new Error('transaction aborted'));
  }));
}

async function storageGet(key){
  if(HAS_INDEXEDDB && !idbBroken){
    try{
      const val = await idbGet(key);
      return val===undefined ? null : {value: val};
    }catch(e){ console.error('IndexedDB read failed, falling back:', e); idbBroken = true; }
  }
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw===null ? null : {value: raw};
  }catch(e){ return null; }
}
async function storageSet(key, value){
  /* IndexedDB writes are transactional: a failed write never partially commits and never
     touches the previous stored value, so old data is protected automatically on failure. */
  if(HAS_INDEXEDDB && !idbBroken){
    try{ await idbSet(key, value); return true; }
    catch(e){ console.error('IndexedDB write failed, falling back:', e); idbBroken = true; }
  }
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.set(key, value, false); }catch(e){ /* fall through */ }
  }
  localStorage.setItem(LS_PREFIX+key, value); /* throws on quota exceeded — caught by saveKey() */
  return true;
}

/* ---- one-time migration: pull any pre-existing data (localStorage / window.storage from
   earlier versions of this app) into IndexedDB, without touching or deleting the originals ---- */
async function migrateLegacyDataToIDB(){
  if(!HAS_INDEXEDDB) return { ran:false, reason:'IndexedDB not supported in this browser' };
  try{
    const flag = await idbGet('__migratedV1');
    if(flag) return { ran:false, reason:'already migrated' };
  }catch(e){ /* proceed and attempt anyway */ }

  let migratedKeys = [];
  for(const key of Object.keys(DEFAULTS)){
    let legacyValue = null;
    if(HAS_CLAUDE_STORAGE){
      try{ const res = await window.storage.get(key, false); if(res && res.value!==undefined) legacyValue = res.value; }catch(e){}
    }
    if(legacyValue===null){
      try{ const raw = localStorage.getItem(LS_PREFIX+key); if(raw!==null) legacyValue = raw; }catch(e){}
    }
    if(legacyValue!==null){
      try{ await idbSet(key, legacyValue); migratedKeys.push(key); }
      catch(e){ console.error('Migration write failed for', key, e); }
    }
  }
  try{ await idbSet('__migratedV1', JSON.stringify(true)); }catch(e){}
  return { ran:true, migratedKeys };
}

/* ================= IMAGE BLOB STORE (Migration) =================
   Converts base64 data-URL images living inline inside STATE fields into
   Blobs stored in the dedicated `images` IndexedDB store, replacing the
   field value with a small `imageId` string only after the new copy has
   been byte-verified. Old base64 values are NEVER overwritten before that
   verification succeeds — see ensureImageStored() and migrateKeyImages().
   NOT wired into app startup yet — only callable manually (e.g. from the
   console or a future settings action) until the display layer (render())
   is updated in a later step to resolve imageId -> Blob URL. */
const IMAGE_ID_PREFIX = 'idb-img://';
const IMAGE_HASH_INDEX_KEY = '__imageHashIndex';
/* Maps a STATE array key to the field names on each item that may hold an image. */
const IMAGE_FIELD_MAP = { characters:['portrait'], kingdoms:['emblem','flag'], designs:['image'] };

function isDataUrlImage(v){ return typeof v==='string' && v.indexOf('data:image')===0; }
function isMigratedImageId(v){ return typeof v==='string' && v.indexOf(IMAGE_ID_PREFIX)===0; }
function genImageId(){ return IMAGE_ID_PREFIX+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }

function dataUrlToBlob(dataUrl){
  const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
  const mimeType = m ? m[1] : 'application/octet-stream';
  const b64 = m ? m[2] : dataUrl.split(',')[1]||'';
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
  return new Blob([bytes], {type: mimeType});
}
async function blobSha256Hex(blob){
  const buf = await blob.arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function imagesPutRaw(record){
  return getIDB().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_IMAGES_STORE, 'readwrite');
    tx.objectStore(IDB_IMAGES_STORE).put(record);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
    tx.onabort = ()=> reject(tx.error || new Error('images tx aborted'));
  }));
}
function imagesGetRaw(id){
  return getIDB().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_IMAGES_STORE, 'readonly');
    const req = tx.objectStore(IDB_IMAGES_STORE).get(id);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
async function loadImageHashIndex(){
  try{ const raw = await idbGet(IMAGE_HASH_INDEX_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
async function saveImageHashIndexEntry(hashIndex, hash, imageId){
  hashIndex[hash] = imageId;
  try{ await idbSet(IMAGE_HASH_INDEX_KEY, JSON.stringify(hashIndex)); }catch(e){ /* non-fatal: dedupe index is a cache, not source of truth */ }
}

/* Ensures a single base64 data-URL image exists as a verified Blob in the images
   store, returning its imageId. Returns {ok:true, imageId, deduped} on success,
   or {ok:false, reason} on ANY failure — in which case nothing was left in an
   inconsistent state that would justify touching the caller's STATE field. */
async function ensureImageStored(dataUrl, hashIndex, stats){
  let blob;
  try{ blob = dataUrlToBlob(dataUrl); }
  catch(e){ return {ok:false, reason:'decode failed: '+e.message}; }

  let hash;
  try{ hash = await blobSha256Hex(blob); }
  catch(e){ return {ok:false, reason:'hash failed: '+e.message}; }

  /* dedupe: if we already have a verified image for this exact content, reuse it
     — but confirm it is still actually readable before trusting the index. */
  if(hashIndex[hash]){
    try{
      const existing = await imagesGetRaw(hashIndex[hash]);
      if(existing && existing.blob){
        const existingHash = await blobSha256Hex(existing.blob);
        if(existingHash === hash){
          stats.deduped++;
          return {ok:true, imageId: hashIndex[hash], deduped:true};
        }
      }
      /* index entry stale/unreadable — fall through and recreate */
    }catch(e){ /* fall through and recreate */ }
  }

  const imageId = genImageId();
  try{ await imagesPutRaw({id:imageId, blob, mimeType: blob.type, size: blob.size, createdAt: Date.now()}); }
  catch(e){ return {ok:false, reason:'store write failed: '+e.message}; }

  /* mandatory re-read + byte-level verification before this counts as success */
  let readBack;
  try{ readBack = await imagesGetRaw(imageId); }
  catch(e){ return {ok:false, reason:'store read-back failed: '+e.message}; }
  if(!readBack || !readBack.blob) return {ok:false, reason:'store read-back returned nothing'};
  if(readBack.blob.size !== blob.size) return {ok:false, reason:`size mismatch: wrote ${blob.size}, read ${readBack.blob.size}`};
  let readBackHash;
  try{ readBackHash = await blobSha256Hex(readBack.blob); }
  catch(e){ return {ok:false, reason:'read-back hash failed: '+e.message}; }
  if(readBackHash !== hash) return {ok:false, reason:`hash mismatch: wrote ${hash}, read ${readBackHash}`};

  stats.blobsCreated++;
  await saveImageHashIndexEntry(hashIndex, hash, imageId);
  return {ok:true, imageId, deduped:false};
}

/* Pure converters: transform a STAGED copy of data (array/object), converting any inline base64
   image field to a stored+verified Blob imageId. They NEVER touch STATE or IndexedDB's appState
   store — only the images store (via ensureImageStored, which is itself write-then-verify safe).
   Shared by both the live migration path below AND the legacy-v17 Import path, so the same
   verified conversion logic runs in both places (per the requirement to reuse it, not duplicate it). */
async function convertArrayImages(list, fields, hashIndex, stats){
  if(!Array.isArray(list) || !list.length) return {value:list, failures:[]};
  const newList = JSON.parse(JSON.stringify(list));
  const failures = [];
  for(let i=0;i<newList.length;i++){
    for(const field of fields){
      const val = newList[i][field];
      if(!isDataUrlImage(val)) continue; // already migrated, or empty, or not an image
      stats.totalFound++;
      const res = await ensureImageStored(val, hashIndex, stats);
      if(!res.ok){ failures.push({index:i, id:newList[i].id, field, reason:res.reason}); continue; }
      newList[i][field] = res.imageId;
    }
  }
  return {value:newList, failures};
}
async function convertHomeImages(obj, hashIndex, stats){
  const cur = obj || {banner:'', logo:''};
  const next = JSON.parse(JSON.stringify(cur));
  const failures = [];
  for(const field of ['banner','logo']){
    const val = next[field];
    if(!isDataUrlImage(val)) continue;
    stats.totalFound++;
    const res = await ensureImageStored(val, hashIndex, stats);
    if(!res.ok){ failures.push({field, reason:res.reason}); continue; }
    next[field] = res.imageId;
  }
  return {value:next, failures};
}
async function convertTrashImages(list, hashIndex, stats){
  if(!Array.isArray(list) || !list.length) return {value:list, failures:[]};
  const newList = JSON.parse(JSON.stringify(list));
  const failures = [];
  for(let i=0;i<newList.length;i++){
    const entry = newList[i];
    const fields = IMAGE_FIELD_MAP[entry.key];
    if(!fields || !entry.item) continue;
    for(const field of fields){
      const val = entry.item[field];
      if(!isDataUrlImage(val)) continue;
      stats.totalFound++;
      const res = await ensureImageStored(val, hashIndex, stats);
      if(!res.ok){ failures.push({trashIndex:i, entryKey:entry.key, field, reason:res.reason}); continue; }
      entry.item[field] = res.imageId;
    }
  }
  return {value:newList, failures};
}

/* Writes one STATE[key] to IndexedDB and reads it back to verify byte-for-byte before updating
   the in-memory STATE — the same "write then verify" discipline used throughout this module.
   Shared by the live migration wrappers below AND by Import's commit step. */
async function writeStateKeyVerified(key, value){
  try{ await idbSet(key, JSON.stringify(value)); }
  catch(e){ return {ok:false, reason:'STATE write failed: '+e.message}; }
  let verifyRaw, verifyParsed;
  try{ verifyRaw = await idbGet(key); verifyParsed = JSON.parse(verifyRaw); }
  catch(e){ return {ok:false, reason:'STATE verify failed: '+e.message}; }
  if(JSON.stringify(verifyParsed) !== JSON.stringify(value)){
    return {ok:false, reason:'STATE verify mismatch after write'};
  }
  STATE[key] = value;
  return {ok:true};
}

/* Live migration wrappers: apply the pure converters above to the CURRENT live STATE, then commit
   via writeStateKeyVerified only if every field converted successfully — same all-or-nothing rule
   as before this refactor (result shape unchanged, so callers/tests are unaffected). */
async function migrateArrayKeyImages(key, fields, hashIndex, stats){
  const list = STATE[key];
  if(!Array.isArray(list) || !list.length) return {key, changed:false, itemsTouched:0, failures:[]};
  const {value:newList, failures} = await convertArrayImages(list, fields, hashIndex, stats);
  if(failures.length) return {key, changed:false, itemsTouched:0, failures};
  let itemsTouched = 0;
  for(let i=0;i<list.length;i++) for(const f of fields) if(list[i][f] !== newList[i][f]) itemsTouched++;
  if(itemsTouched===0) return {key, changed:false, itemsTouched:0, failures:[]};
  const writeRes = await writeStateKeyVerified(key, newList);
  if(!writeRes.ok) return {key, changed:false, itemsTouched:0, failures:[{reason:writeRes.reason}]};
  return {key, changed:true, itemsTouched, failures:[]};
}
async function migrateHomeImages(hashIndex, stats){
  const cur = STATE.homeImages || {banner:'', logo:''};
  const {value:next, failures} = await convertHomeImages(cur, hashIndex, stats);
  if(failures.length) return {key:'homeImages', changed:false, itemsTouched:0, failures};
  const changed = next.banner!==cur.banner || next.logo!==cur.logo;
  if(!changed) return {key:'homeImages', changed:false, itemsTouched:0, failures:[]};
  const writeRes = await writeStateKeyVerified('homeImages', next);
  if(!writeRes.ok) return {key:'homeImages', changed:false, itemsTouched:0, failures:[{reason:writeRes.reason}]};
  return {key:'homeImages', changed:true, itemsTouched:1, failures:[]};
}
async function migrateTrashImages(hashIndex, stats){
  const list = STATE.trash;
  if(!Array.isArray(list) || !list.length) return {key:'trash', changed:false, itemsTouched:0, failures:[]};
  const {value:newList, failures} = await convertTrashImages(list, hashIndex, stats);
  if(failures.length) return {key:'trash', changed:false, itemsTouched:0, failures};
  let itemsTouched = 0;
  for(let i=0;i<list.length;i++){
    const fields = IMAGE_FIELD_MAP[list[i].key];
    if(!fields || !list[i].item) continue;
    for(const f of fields) if(list[i].item[f] !== newList[i].item[f]) itemsTouched++;
  }
  if(itemsTouched===0) return {key:'trash', changed:false, itemsTouched:0, failures:[]};
  const writeRes = await writeStateKeyVerified('trash', newList);
  if(!writeRes.ok) return {key:'trash', changed:false, itemsTouched:0, failures:[{reason:writeRes.reason}]};
  return {key:'trash', changed:true, itemsTouched, failures:[]};
}

/* Top-level entry point. Safe to call multiple times (idempotent): already-migrated
   fields hold an imageId (not a data URL) and are skipped automatically. NOT called
   automatically anywhere yet. */
async function migrateImagesToBlobStore(){
  if(!HAS_INDEXEDDB) return {ok:false, reason:'IndexedDB not supported in this browser'};
  const hashIndex = await loadImageHashIndex();
  const stats = {totalFound:0, blobsCreated:0, deduped:0};
  const results = [];
  for(const key of Object.keys(IMAGE_FIELD_MAP)){
    results.push(await migrateArrayKeyImages(key, IMAGE_FIELD_MAP[key], hashIndex, stats));
  }
  results.push(await migrateHomeImages(hashIndex, stats));
  results.push(await migrateTrashImages(hashIndex, stats));

  const failedKeys = results.filter(r=>r.failures && r.failures.length);
  const migratedFields = results.reduce((sum,r)=>sum+(r.itemsTouched||0),0);
  if(migratedFields>0) updateStorageIndicator(); /* only worth refreshing if something actually moved into the blob store */
  return {
    ok: failedKeys.length===0,
    totalImagesFound: stats.totalFound,
    fieldsMigrated: migratedFields,
    blobsCreated: stats.blobsCreated,
    deduped: stats.deduped,
    perKeyResults: results,
  };
}

/* ================= EXPORT / IMPORT — IMAGE SUPPORT =================
   Everything below is additive support for Export/Import to work with the imageId+Blob system
   while keeping the .rei-project file a single self-contained JSON (base64 images embedded in
   an `images` map), per the agreed design. */

/* Legacy-import variant of migration: converts every base64 image field found on a STAGED,
   in-memory copy of imported data — NEVER on live STATE, and NEVER writing to the appState
   IDB store. Only the shared `images` Blob store is touched (write+verify per image, exactly
   like ensureImageStored used elsewhere) — safe, shared infrastructure that never overwrites
   any live project data. Returns {ok:true, data:migratedCopy} only if EVERY image field in the
   entire staged copy converted successfully; otherwise {ok:false, reason} and the staged copy
   is simply discarded — nothing about the live project or its images was ever touched. */
async function migrateImageFieldsInObject(sourceObj, hashIndex, stats){
  const data = JSON.parse(JSON.stringify(sourceObj)); // staged copy — source untouched
  for(const key of Object.keys(IMAGE_FIELD_MAP)){
    const list = data[key];
    if(!Array.isArray(list)) continue;
    for(const item of list){
      if(!item) continue;
      for(const field of IMAGE_FIELD_MAP[key]){
        const val = item[field];
        if(!isDataUrlImage(val)) continue;
        stats.totalFound++;
        const res = await ensureImageStored(val, hashIndex, stats);
        if(!res.ok) return {ok:false, reason:`${key}.${field} (id:${item.id||'?'}): ${res.reason}`};
        item[field] = res.imageId;
      }
    }
  }
  if(data.homeImages){
    for(const field of ['banner','logo']){
      const val = data.homeImages[field];
      if(!isDataUrlImage(val)) continue;
      stats.totalFound++;
      const res = await ensureImageStored(val, hashIndex, stats);
      if(!res.ok) return {ok:false, reason:`homeImages.${field}: ${res.reason}`};
      data.homeImages[field] = res.imageId;
    }
  }
  if(Array.isArray(data.trash)){
    for(const entry of data.trash){
      const fields = IMAGE_FIELD_MAP[entry.key];
      if(!fields || !entry.item) continue;
      for(const field of fields){
        const val = entry.item[field];
        if(!isDataUrlImage(val)) continue;
        stats.totalFound++;
        const res = await ensureImageStored(val, hashIndex, stats);
        if(!res.ok) return {ok:false, reason:`trash[${entry.item.id||'?'}].${field}: ${res.reason}`};
        entry.item[field] = res.imageId;
      }
    }
  }
  return {ok:true, data};
}

/* Scans a STATE-shaped object (live STATE, or a staged copy from an import file) and returns the
   Set of every migrated imageId actually referenced by its fields — characters/kingdoms/designs,
   homeImages, and trash entries. Shared by Export (to know which blobs to embed) and Import (to
   know which blobs the file MUST supply). */
function collectReferencedImageIds(data){
  const ids = new Set();
  function checkVal(v){ if(isMigratedImageId(v)) ids.add(v); }
  for(const key of Object.keys(IMAGE_FIELD_MAP)){
    const list = data[key];
    if(Array.isArray(list)) list.forEach(item=>{ if(item) IMAGE_FIELD_MAP[key].forEach(f=>checkVal(item[f])); });
  }
  if(data.homeImages){ checkVal(data.homeImages.banner); checkVal(data.homeImages.logo); }
  if(Array.isArray(data.trash)){
    data.trash.forEach(entry=>{
      const fields = IMAGE_FIELD_MAP[entry.key];
      if(fields && entry.item) fields.forEach(f=>checkVal(entry.item[f]));
    });
  }
  return ids;
}
function blobToBase64DataUrl(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(reader.error || new Error('FileReader failed'));
    reader.readAsDataURL(blob);
  });
}
/* Shared dump builder — used by exportAll() now, and reusable later for the Google Drive backup
   step (not touched in this task). Read-only: never mutates STATE or IndexedDB. */
async function buildProjectDump(){
  const dump = { schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(), app:'REI-SONANCE' };
  Object.keys(DEFAULTS).forEach(k=>dump[k]=STATE[k]);
  const referencedIds = collectReferencedImageIds(dump);
  const images = {};
  for(const id of referencedIds){
    const rec = await imagesGetRaw(id);
    if(rec && rec.blob) images[id] = await blobToBase64DataUrl(rec.blob);
    /* if a referenced id's blob is unexpectedly missing, it's simply omitted here rather than
       failing the whole export — not expected to occur given ensureImageStored's write-then-verify
       guarantee, but Export should never crash the app over it. */
  }
  dump.images = images;
  return dump;
}
/* Pre-flight check for Import: if the staged data references any migrated imageId, the file's
   `images` map MUST contain a valid base64 entry for every single one of them, or the import is
   rejected before anything is touched — catching a corrupted/truncated "new format" file up front,
   before even asking the user to confirm. */
function validateImageCompleteness(data){
  const staged = {};
  Object.keys(DEFAULTS).forEach(k=>{ if(data[k]!==undefined) staged[k]=data[k]; });
  const referencedIds = collectReferencedImageIds(staged);
  if(referencedIds.size===0) return {ok:true};
  const images = (data.images && typeof data.images==='object' && !Array.isArray(data.images)) ? data.images : null;
  if(!images) return {ok:false, reason:'الملف يحتوي على مراجع صور لكن بدون بيانات الصور الفعلية.'};
  for(const id of referencedIds){
    const v = images[id];
    if(!v || typeof v!=='string' || v.indexOf('data:image')!==0){
      return {ok:false, reason:`صورة مفقودة أو تالفة في الملف: ${id}`};
    }
  }
  return {ok:true};
}
/* Stores one imported image under its ORIGINAL imageId from the file (exact restore — the staged
   STATE fields already reference this exact id, so nothing needs rewriting). Write-then-verify,
   same discipline as ensureImageStored. Idempotent: re-importing the same file overwrites the same
   id rather than creating a duplicate, so repeated Export→Import cycles don't accumulate blobs. */
async function storeImportedImageById(id, dataUrl, hashIndex, stats){
  let blob;
  try{ blob = dataUrlToBlob(dataUrl); }
  catch(e){ return {ok:false, reason:`decode failed for ${id}: ${e.message}`}; }
  let hash;
  try{ hash = await blobSha256Hex(blob); }
  catch(e){ return {ok:false, reason:`hash failed for ${id}: ${e.message}`}; }
  try{ await imagesPutRaw({id, blob, mimeType:blob.type, size:blob.size, createdAt:Date.now()}); }
  catch(e){ return {ok:false, reason:`store write failed for ${id}: ${e.message}`}; }
  let readBack;
  try{ readBack = await imagesGetRaw(id); }
  catch(e){ return {ok:false, reason:`store read-back failed for ${id}: ${e.message}`}; }
  if(!readBack || !readBack.blob) return {ok:false, reason:`store read-back returned nothing for ${id}`};
  let readBackHash;
  try{ readBackHash = await blobSha256Hex(readBack.blob); }
  catch(e){ return {ok:false, reason:`read-back hash failed for ${id}: ${e.message}`}; }
  if(readBackHash !== hash) return {ok:false, reason:`hash mismatch for ${id}`};
  stats.blobsCreated++;
  await saveImageHashIndexEntry(hashIndex, hash, id);
  return {ok:true};
}

/* Shared commit path for ANY imported project data — used by both handleImportFile() (local
   .rei-project file) and restoreFromDriveBackup() (Google Drive), so this safety-critical logic
   exists in exactly one place. Handles both new-format files (`images` map) and legacy v17 files
   (inline base64) via a staged in-memory copy, verifies every image reference is actually present
   in the images store, and ONLY THEN commits to live STATE. Returns {ok:true} or
   {ok:false, reason} — on failure, STATE and all current project images are guaranteed untouched
   (any blobs already written during a failed attempt are safe orphans, reusable later via dedupe). */
async function applyImportedProjectData(data){
  const hasNewFormatImages = data.images && typeof data.images==='object' && !Array.isArray(data.images) && Object.keys(data.images).length>0;
  let finalData = data;
  if(hasNewFormatImages){
    const hashIndex = await loadImageHashIndex();
    const stats = {blobsCreated:0};
    const failures = [];
    for(const id of Object.keys(data.images)){
      const res = await storeImportedImageById(id, data.images[id], hashIndex, stats);
      if(!res.ok) failures.push(res.reason);
    }
    if(failures.length) return {ok:false, reason:'فشل استيراد بعض الصور، ولم يتم تغيير المشروع الحالي.\n\n' + failures.join('\n')};
  } else {
    const hashIndex = await loadImageHashIndex();
    const stats = {totalFound:0, blobsCreated:0, deduped:0};
    const staged = await migrateImageFieldsInObject(data, hashIndex, stats);
    if(!staged.ok) return {ok:false, reason:'فشل تحويل صور الملف القديم، ولم يتم تغيير المشروع الحالي.\n\n' + staged.reason};
    finalData = staged.data;
  }
  const finalIds = Array.from(collectReferencedImageIds(finalData));
  for(const id of finalIds){
    const rec = await imagesGetRaw(id);
    if(!rec || !rec.blob) return {ok:false, reason:'فشل التحقق النهائي من الصور المستوردة، ولم يتم تغيير المشروع الحالي.'};
  }
  Object.keys(DEFAULTS).forEach(k=>{
    if(finalData[k]!==undefined){ STATE[k] = finalData[k]; queueSave(k); }
  });
  applyTheme(STATE.theme||'rei');
  applyFontSize(STATE.fontSize||'medium');
  applyDensity(STATE.density||'comfortable');
  updateStorageIndicator(); /* covers both local Import and Google Drive restore, since both call this function */
  return {ok:true};
}


/* ================= IMAGE DISPLAY (imageId -> Blob URL) =================
   resolveImageSrc(value) is the single place every <img>/background render
   site should call. It is fully synchronous (render() stays sync):
     - '' / falsy            -> ''
     - legacy data:image URL (not migrated yet) -> returned as-is
     - migrated imageId, cached -> the cached Blob URL
     - migrated imageId, not yet loaded -> '' (placeholder), and an async
       load is kicked off; once it resolves, only the specific DOM elements
       tagged data-imgid="<id>" are patched directly (see patchImageElements),
       NOT a full render() — so an open edit form is never disrupted by an
       unrelated image finishing its load elsewhere on the page.
   The cache is a simple size-capped LRU: oldest Blob URL is revoked when the
   cap is exceeded, so URL.createObjectURL is never called twice for the same
   imageId while it's in use, and old URLs are eventually released. */
const imageBlobUrlCache = new Map(); // imageId -> objectURL, insertion order = LRU order
const imageLoadInFlight = new Set(); // imageIds currently being fetched, to avoid duplicate loads
const IMAGE_URL_CACHE_MAX = 300;

function touchImageCacheEntry(imageId){
  const url = imageBlobUrlCache.get(imageId);
  if(url===undefined) return;
  imageBlobUrlCache.delete(imageId);
  imageBlobUrlCache.set(imageId, url); // re-insert = move to most-recently-used end
}
function cacheImageUrl(imageId, url){
  imageBlobUrlCache.set(imageId, url);
  if(imageBlobUrlCache.size > IMAGE_URL_CACHE_MAX){
    const oldestId = imageBlobUrlCache.keys().next().value;
    const oldestUrl = imageBlobUrlCache.get(oldestId);
    imageBlobUrlCache.delete(oldestId);
    try{ URL.revokeObjectURL(oldestUrl); }catch(e){}
  }
}
function patchImageElements(imageId, url){
  /* Handles both <img data-imgid="..."> (src swap) and any non-<img> element that renders
     the same imageId as a CSS background-image (data-imgid + data-img-bg="1"). The optional
     data-bg-prefix attribute holds any extra background-image layer (e.g. a gradient overlay)
     that must be kept in front of the photo — see renderBannerLogo() for the one current
     consumer. This is purely additive: elements that only ever used data-imgid+<img> before
     are completely unaffected, since they hit the first branch exactly as before. */
  document.querySelectorAll(`[data-imgid="${imageId}"]`).forEach(el=>{
    if(el.tagName==='IMG'){ el.src = url; return; }
    if(el.dataset.imgBg==='1'){
      const prefix = el.dataset.bgPrefix || '';
      el.style.backgroundImage = (prefix ? prefix+', ' : '') + `url('${url}')`;
    }
  });
}
async function loadImageBlobUrlAsync(imageId){
  try{
    const rec = await imagesGetRaw(imageId);
    if(rec && rec.blob){
      const url = URL.createObjectURL(rec.blob);
      cacheImageUrl(imageId, url);
      patchImageElements(imageId, url);
      if(typeof renderBannerLogo==='function') renderBannerLogo(); // cheap targeted refresh; safe even if not affected
    }
  }catch(e){ console.error('image blob load failed', imageId, e); }
  finally{ imageLoadInFlight.delete(imageId); }
}
function resolveImageSrc(value){
  if(!value) return '';
  if(isDataUrlImage(value)) return value; // legacy / not-yet-migrated inline image — show directly
  if(!isMigratedImageId(value)) return value; // unrecognized format — defensive fallback, show as-is
  if(imageBlobUrlCache.has(value)){ touchImageCacheEntry(value); return imageBlobUrlCache.get(value); }
  if(!imageLoadInFlight.has(value)){ imageLoadInFlight.add(value); loadImageBlobUrlAsync(value); }
  return ''; // placeholder until the async load above patches the DOM directly
}

async function loadAll(){
  await Promise.all(Object.keys(DEFAULTS).map(async key=>{
    try{
      const res = await storageGet(key);
      if(res && res.value !== undefined) STATE[key] = JSON.parse(res.value);
    }catch(e){}
  }));
}
function queueSave(key){
  flashSaving();
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(()=>saveKey(key), 350);
}
async function saveKey(key){
  try{
    await storageSet(key, JSON.stringify(STATE[key]));
    flashSaved();
    if(key!=='googleDrive') queueDriveSync(); /* local save always happens first; cloud sync is a separate, debounced, optional layer on top */
  }
  catch(e){ console.error('save fail',key,e); flashSaveError(); }
}
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* ---- rich text editor (Bold/Italic/Bullet List/Subheading) ---- */
function plainToHtml(s){
  if(!s) return '';
  /* Only treat it as already-HTML if it contains tags our own rich text editor actually
     produces. A generic "<...>" test wrongly matched legacy plain text like "<TODO>" or
     "<Important>" and skipped escaping it, which silently corrupted it on display. */
  if(/<\/?(b|i|strong|em|ul|li|h4|br|div)(\s|>|\/)/i.test(s)) return s;
  return esc(s).replace(/\n/g,'<br>');
}
function stripHtml(html){
  if(!html) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent||tmp.innerText||'').trim();
}
function richTextFieldHtml(id, val, placeholder, big){
  return `<div class="rte-wrap">
    <div class="rte-toolbar-header" onclick="toggleRteToolbar('${id}')">
      <span>أدوات التنسيق</span><span class="rte-toolbar-arrow" id="${id}_arrow">▼</span>
    </div>
    <div class="rte-toolbar" id="${id}_toolbar" style="display:none;">
      <button type="button" title="Bold" onclick="rteCmd('${id}','bold')"><b>B</b></button>
      <button type="button" title="Italic" onclick="rteCmd('${id}','italic')"><i>I</i></button>
      <button type="button" title="Bullet List" onclick="rteCmd('${id}','insertUnorderedList')">•≡</button>
      <button type="button" title="Subheading" onclick="rteCmd('${id}','formatBlock','H4')">H</button>
      <button type="button" title="Clear Formatting" onclick="rteClearFormat('${id}')">✕</button>
    </div>
    <div class="rte-editor ${big?'big':''}" id="${id}" contenteditable="true" data-placeholder="${esc(placeholder||'')}">${plainToHtml(val)}</div>
  </div>`;
}
function toggleRteToolbar(id){

/* Positions .cdd-menu (position:fixed) using the trigger's actual on-screen rect, clamped to stay
   fully inside the viewport on every edge — replaces the old static right:0 / media-query flip,
   which only accounted for overall screen width, not where a given trigger actually sits (the real
   cause of RTL menus running off-screen: a trigger near the left edge still had its menu grow
   further left via right:0, with no clamp against the viewport's actual left boundary). */
function positionDropdownMenu(cddEl){
  const trigger = cddEl.querySelector('.cdd-trigger');
  const menu = cddEl.querySelector('.cdd-menu');
  if(!trigger || !menu) return;
  const margin = 8;
  const triggerRect = trigger.getBoundingClientRect();
  /* form-context dropdowns are authored with an inline width:100% meant to match their trigger —
     under position:fixed that percentage would resolve against the viewport instead, so pin it
     explicitly to the trigger's real width before measuring. */

    menu.style.width = triggerRect.width + 'px';
    menu.style.minWidth = triggerRect.width + 'px';
  }
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const menuWidth = menu.offsetWidth || Math.max(triggerRect.width, 170);
  let left = triggerRect.right - menuWidth; /* default: align menu's right edge with trigger's right edge */
  if(left + menuWidth > vw - margin) left = vw - margin - menuWidth; /* clamp off the right edge */
  if(left < margin) left = margin; /* clamp off the left edge (also covers menus wider than the viewport) */
  let top = triggerRect.bottom + 5;
  const menuHeight = Math.min(menu.scrollHeight || 260, 260);
  if(top + menuHeight > vh - margin) top = Math.max(margin, triggerRect.top - menuHeight - 5); /* flip above trigger if no room below */
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

/* ---- swipe gesture: edge-swipe from the right opens the sidebar, swipe on open sidebar closes it ---- */
(function setupSwipeDrawer(){
  const EDGE = 26, THRESH = 0.32;
  let startX=0, startY=0, tracking=false, styled=false, opening=false, sbWidth=0, decided=false, horizontal=false;
  function isMobile(){ return window.innerWidth <= 880; }
  function getSidebar(){ return document.getElementById('sidebar'); }
  function getBackdrop(){ return document.getElementById('backdrop'); }
  function applyInlineStyles(){
    if(styled) return;
    styled = true;
    const sidebar = getSidebar(), backdrop = getBackdrop();
    sidebar.style.transition = 'none';
    backdrop.style.transition = 'none';
    if(opening) backdrop.style.display = 'block';
  }
  function clearInlineStyles(){
    if(!styled) return;
    styled = false;
    const sidebar = getSidebar(), backdrop = getBackdrop();
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    backdrop.style.transition = '';
    backdrop.style.opacity = '';
    backdrop.style.display = '';
  }
  document.addEventListener('touchstart', e=>{
    if(!isMobile()) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    decided = false; horizontal = false; styled = false;
    const sidebar = getSidebar();
    const isOpen = sidebar.classList.contains('open');
    if(!isOpen && startX > window.innerWidth - EDGE){
      tracking = true; opening = true;
      sbWidth = sidebar.offsetWidth || Math.round(window.innerWidth*0.82);
    } else if(isOpen){
      tracking = true; opening = false;
      sbWidth = sidebar.offsetWidth;
    } else {
      tracking = false;
    }
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(!decided){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      horizontal = Math.abs(dx) > Math.abs(dy);
      decided = true;
      if(!horizontal){ tracking = false; return; }
      applyInlineStyles();
    }
    if(!horizontal) return;
    const sidebar = getSidebar();
    const backdrop = getBackdrop();
    if(opening){
      const pct = Math.min(1, Math.max(0, -dx / sbWidth));
      sidebar.style.transform = `translateX(${100 - pct*100}%)`;
      backdrop.style.opacity = pct*0.6;
    } else {
      const pct = Math.min(1, Math.max(0, dx / sbWidth));
      sidebar.style.transform = `translateX(${pct*100}%)`;
      backdrop.style.opacity = 0.6*(1-pct);
    }
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!tracking){ return; }
    tracking = false;
    if(!horizontal){ return; }
    clearInlineStyles();
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    if(opening){
      if(-dx > sbWidth*THRESH) toggleSidebar(true); else toggleSidebar(false);
    } else {
      if(dx > sbWidth*THRESH) toggleSidebar(false); else toggleSidebar(true);
    }
  });
})();

function doSearch(q, forceRun){
  const box = document.getElementById('searchResults');
  q = q.trim();
  if(STATE.searchSettings && STATE.searchSettings.liveSearch===false && !forceRun) return;
  if(STATE.searchSettings && STATE.searchSettings.rememberLast!==false){ STATE.lastSearch=q; queueSave('lastSearch'); }
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const results = [];
  SEARCH_INDEX.forEach(src=>{
    (STATE[src.stateKey]||[]).forEach(item=>{
      const t = item[src.tf]||'';
      if(t.toLowerCase().includes(q.toLowerCase())){
        results.push({...src, id:item.id, name:t});
      }
    });
  });
  const showType = !(STATE.searchSettings && STATE.searchSettings.showType===false);
  if(results.length===0){ box.innerHTML = '<div class="sr-item">لا نتائج</div>'; }
  else{
    box.innerHTML = results.slice(0,20).map((r,i)=>`<div class="sr-item" onclick="searchNavIdx(${i})">${showType?`<b>${r.ic} ${r.label}:</b> `:''}${esc(r.name)}</div>`).join('');
    window.__searchResults = results.slice(0,20);
  }
  box.classList.add('show');
}
function searchKeydown(e, val){
  if(e.key==='Enter') doSearch(val, true);
}
function searchNavIdx(i){
  const r = window.__searchResults[i];
  if(!r) return;
  document.getElementById('searchResults').classList.remove('show');
  document.getElementById('globalSearch').value='';
  if(r.sub) subTab[r.sub.k] = r.sub.v;
  go(r.view);

    else if(r.view==='quicknotes') editQN(r.id);
    else if(r.key) openDetail(r.key, r.id);
  }, 70);
}

/* ================= LIGHTBOX (zoom/pan image viewer) ================= */
let lbState = {scale:1, x:0, y:0, dragging:false, startX:0, startY:0, pinchDist:0};
function openLightbox(src, e){
  if(e) e.stopPropagation();
  if(!src) return;
  lbState = {scale:1, x:0, y:0, dragging:false, startX:0, startY:0, pinchDist:0};
  const imgEl = document.getElementById('lightboxImg');
  imgEl.src = resolveImageSrc(src);
  imgEl.setAttribute('data-imgid', src); // in case the blob is still loading, patchImageElements will fill it in
  updateLightboxTransform();
  document.getElementById('lightboxBackdrop').classList.add('show');
}
function closeLightbox(){ document.getElementById('lightboxBackdrop').classList.remove('show'); }
function updateLightboxTransform(){
  const img = document.getElementById('lightboxImg');
  if(img) img.style.transform = `translate(${lbState.x}px, ${lbState.y}px) scale(${lbState.scale})`;
}
function lbZoom(delta){
  lbState.scale = Math.min(4, Math.max(1, lbState.scale + delta));
  if(lbState.scale===1){ lbState.x=0; lbState.y=0; }
  updateLightboxTransform();
}
function lbReset(){ lbState.scale=1; lbState.x=0; lbState.y=0; updateLightboxTransform(); }
function lbSetup(){
  const img = document.getElementById('lightboxImg');
  if(!img || img.__lbBound) return;
  img.__lbBound = true;
  const dist = (t1,t2)=>Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
  img.addEventListener('dblclick', ()=>{ if(lbState.scale>1) lbReset(); else { lbState.scale=2; updateLightboxTransform(); } });
  img.addEventListener('wheel', e=>{ e.preventDefault(); lbZoom(e.deltaY<0?0.3:-0.3); }, {passive:false});
  img.addEventListener('mousedown', e=>{
    if(lbState.scale<=1) return;
    lbState.dragging=true; lbState.startX=e.clientX-lbState.x; lbState.startY=e.clientY-lbState.y; img.style.cursor='grabbing';
  });
  window.addEventListener('mousemove', e=>{
    if(!lbState.dragging) return;
    lbState.x=e.clientX-lbState.startX; lbState.y=e.clientY-lbState.startY; updateLightboxTransform();
  });
  window.addEventListener('mouseup', ()=>{ lbState.dragging=false; img.style.cursor='grab'; });
  img.addEventListener('touchstart', e=>{
    if(e.touches.length===2){ lbState.pinchDist = dist(e.touches[0],e.touches[1]); }
    else if(e.touches.length===1 && lbState.scale>1){
      lbState.dragging=true; lbState.startX=e.touches[0].clientX-lbState.x; lbState.startY=e.touches[0].clientY-lbState.y;
    }
  }, {passive:true});
  img.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      const d = dist(e.touches[0],e.touches[1]);
      const delta = (d - lbState.pinchDist)/220;
      lbState.scale = Math.min(4, Math.max(1, lbState.scale+delta));
      lbState.pinchDist = d;
      if(lbState.scale===1){ lbState.x=0; lbState.y=0; }
      updateLightboxTransform();
    } else if(e.touches.length===1 && lbState.dragging){
      lbState.x = e.touches[0].clientX - lbState.startX;
      lbState.y = e.touches[0].clientY - lbState.startY;
      updateLightboxTransform();
    }
  }, {passive:true});
  img.addEventListener('touchend', ()=>{ lbState.dragging=false; });
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  const lightboxOpen = document.getElementById('lightboxBackdrop').classList.contains('show');
  if(lightboxOpen){ closeLightbox(); return; }
  const modalOpen = document.getElementById('modalBackdrop').classList.contains('show');
  if(modalOpen){ closeModal(); }
});

/* ================= GENERIC FIELD RENDER (forms) ================= */
/* form-context dropdown: doesn't trigger a full re-render, just updates its own hidden input + label (preserves in-progress form state) */
function formDropdownHtml(id, options, selected, placeholder){
  const ddId = 'ddf_'+id;
  const selOpt = options.find(o=>String(o.value)===String(selected||''));
  const displayLabel = selOpt ? selOpt.label : (placeholder||'—');
  return `<div class="cdd" id="${ddId}" style="width:100%;">
    <input type="hidden" id="${id}" value="${selected?esc(selected):''}">
    <div class="cdd-trigger" style="width:100%;justify-content:space-between;" onclick="toggleDropdown('${ddId}', event)"><span>${esc(displayLabel)}</span><span class="arrow">▾</span></div>
    <div class="cdd-menu" style="width:100%;min-width:100%;">
      ${options.map(o=>`<div class="cdd-opt ${String(o.value)===String(selected||'')?'selected':''}" onclick="selectFormDropdown('${ddId}','${id}', ${jsStr(o.value)}, ${jsStr(o.label)}, event)">${esc(o.label)}</div>`).join('')}
    </div>
  </div>`;
}
function selectFormDropdown(ddId, hiddenId, value, label, e){
  if(e) e.stopPropagation();
  document.getElementById(hiddenId).value = value;
  const dd = document.getElementById(ddId);
  dd.querySelector('.cdd-trigger span').textContent = label;
  dd.querySelectorAll('.cdd-opt').forEach(o=>o.classList.remove('selected'));
  e.target.classList.add('selected');
  dd.classList.remove('open');
}
function fieldHtml(f, val){
  const id = `fld_${f.k}`;
  val = val===undefined? '' : val;
  if(f.type==='select'){
    const opts = (typeof f.options==='function'? f.options() : f.options)||[];
    const ddOpts = [{value:'',label:'—'}, ...opts.map(o=>({value:o,label:o}))];
    return `<div class="field ${f.full?'full':''}"><label>${f.label}</label>${formDropdownHtml(id, ddOpts, val)}</div>`;
  }
  if(f.type==='relation'){
    const list = STATE[f.relation]||[];
    const tf = f.relationTitle||'name';
    const ddOpts = [{value:'',label:'—'}, ...list.map(o=>({value:o.id,label:o[tf]}))];
    return `<div class="field ${f.full?'full':''}"><label>${f.label}</label>${formDropdownHtml(id, ddOpts, val)}</div>`;
  }
  if(f.type==='multiselect'){
    const list = STATE[f.relation]||[];
    const tf = f.relationTitle||'name';
    const cur = Array.isArray(val)?val:[];
    const isCharacters = f.relation==='characters';
    return `<div class="field full"><label>${f.label}</label><div class="chip-grid" id="${id}">
      ${list.length? list.map(o=>{
        const selected = cur.includes(o.id);
        const thumb = (isCharacters && o.portrait) ? `<img class="chip-thumb" src="${resolveImageSrc(o.portrait)}" data-imgid="${esc(o.portrait)}">` : '';
        return `<label class="chip-item ${selected?'chip-selected':''}"><input type="checkbox" value="${o.id}" ${selected?'checked':''} onchange="this.closest('.chip-item').classList.toggle('chip-selected', this.checked)">${thumb}${esc(o[tf])}</label>`;
      }).join('') : '<span style="color:var(--muted-2);font-size:12px;">لا توجد عناصر بعد</span>'}
    </div></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field ${f.full?'full':''}"><label>${f.label}</label>${richTextFieldHtml(id, val, f.label)}</div>`;
  }
  if(f.type==='image'){
    const zoneLabel = f.label.replace(/\s*\(صورة\)\s*$/,'');
    return `<div class="field full"><label>${f.label}</label>
      <input type="file" accept="image/*" id="${id}" onchange="handleImageInput(this)" style="display:none">
      <input type="hidden" id="${id}_data" value="${val?esc(val):''}">
      <div class="img-upload-zone" id="${id}_empty" style="${val?'display:none;':''}" onclick="document.getElementById('${id}').click()">
        <div class="iz-icon">${f.icon||'🖼️'}</div>
        <div class="iz-label">${esc(zoneLabel)}</div>
        <div class="iz-hint">اضغط لرفع ${esc(zoneLabel)}</div>
      </div>
      <div class="img-upload-filled" id="${id}_filled" style="${val?'':'display:none;'}">
        <img class="preview" id="${id}_previewImg" src="${val?resolveImageSrc(val):''}" data-imgid="${val?esc(val):''}">
        <button type="button" class="btn-ghost btn-sm" onclick="clearImageField('${id}')">✕ إزالة الصورة</button>
      </div>
    </div>`;
  }
  return `<div class="field ${f.full?'full':''}"><label>${f.label}</label><input type="text" id="${id}" value="${esc(val)}"></div>`;
}
function resizeImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function handleImageInput(input){
  const file = input.files[0];
  if(!file) return;
  resizeImageFile(file, 260, 0.65).then(dataUrl=>{
    document.getElementById(input.id+'_data').value = dataUrl;
    const previewImg = document.getElementById(input.id+'_previewImg');
    if(previewImg){
      previewImg.src = dataUrl;
      previewImg.removeAttribute('data-imgid'); /* fresh upload is a raw data URL, not a migrated imageId yet — clear any stale imageId from a previous image so a late async blob patch can never overwrite this fresh preview */
    }
    const emptyZone = document.getElementById(input.id+'_empty');
    const filledZone = document.getElementById(input.id+'_filled');
    if(emptyZone) emptyZone.style.display = 'none';
    if(filledZone) filledZone.style.display = '';
  });
}
/* Clears an image field's reference in the FORM only (the hidden value that will be saved to
   STATE on submit) — never touches the images Blob store. The underlying Blob (if the field
   already held a migrated imageId) is deliberately left in place: it may still be referenced
   elsewhere (shared via dedup) or in Trash, and orphan cleanup is intentionally a separate,
   future, explicit feature — not an automatic side effect of clearing a form field. */
function clearImageField(id){
  const dataEl = document.getElementById(id+'_data');
  if(dataEl) dataEl.value = '';
  const previewImg = document.getElementById(id+'_previewImg');
  if(previewImg){ previewImg.src = ''; previewImg.removeAttribute('data-imgid'); }
  const emptyZone = document.getElementById(id+'_empty');
  const filledZone = document.getElementById(id+'_filled');
  if(emptyZone) emptyZone.style.display = '';
  if(filledZone) filledZone.style.display = 'none';
}
function collectForm(fields){
  const item = {};
  fields.forEach(f=>{
    if(f.type==='multiselect'){
      const boxes = document.querySelectorAll(`#fld_${f.k} input[type=checkbox]:checked`);
      item[f.k] = Array.from(boxes).map(b=>b.value);
    } else if(f.type==='image'){
      const dataEl = document.getElementById(`fld_${f.k}_data`);
      item[f.k] = dataEl ? dataEl.value : '';
    } else if(f.type==='textarea'){
      const el = document.getElementById(`fld_${f.k}`);
      item[f.k] = el ? el.innerHTML.trim() : '';
    } else {
      const el = document.getElementById(`fld_${f.k}`);
      item[f.k] = el ? el.value.trim() : '';
    }
  });
  return item;
}

const TRASH_TYPES = ['characters','places','abilities','chapters','ideas'];
function softDelete(key, id){
  const idx = STATE[key].findIndex(x=>x.id===id);
  if(idx<0) return;
  const item = STATE[key][idx];
  STATE[key].splice(idx,1);
  if(TRASH_TYPES.includes(key)){
    STATE.trash.push({key, item, deletedAt:Date.now()});
    queueSave('trash');
  }
  queueSave(key);
}
function restoreTrashItem(idx){
  const t = STATE.trash[idx];
  if(!t) return;
  STATE[t.key].push(t.item);
  STATE.trash.splice(idx,1);
  queueSave(t.key); queueSave('trash');
  render();
}
function permanentDeleteTrashItem(idx){
  showConfirm({title:'حذف نهائي', message:'سيتم حذف هذا العنصر نهائياً ولا يمكن التراجع بعد ذلك.', danger:true, confirmLabel:'حذف نهائي', onConfirm:()=>{
    STATE.trash.splice(idx,1);
    queueSave('trash');
    render();
  }});
}
function deleteGenericItem(key, id){
  const item = STATE[key].find(x=>x.id===id);
  const tf = (CFG[key]&&CFG[key].titleField)||'name';
  const isTrashable = TRASH_TYPES.includes(key);
  showConfirm({
    title:'تأكيد الحذف', danger:true, confirmLabel:'حذف',
    message: isTrashable
      ? `سيُنقل "${item?item[tf]:''}" إلى المحذوفة مؤخراً، وتگدر تسترجعه من الإعدادات لاحقاً.`
      : `سيتم حذف "${item?item[tf]:''}" نهائياً. متأكد؟`,
    onConfirm(){
      softDelete(key, id);
      closeModal();
      render();
    }
  });
}
function genericFormHtml(cfg){
  const editing = editingId[cfg.key];
  const item = editing ? STATE[cfg.key].find(x=>x.id===editing) : {};
  if(!openForm[cfg.key]) return '';
  return `<div class="form-card">
    <div class="form-grid">${cfg.fields.map(f=>fieldHtml(f, item?item[f.k]:'')).join('')}</div>
    <div class="form-actions">

    </div>
