const NON_SEARCHABLE_FIELDS = new Set(['image','portrait','emblem','flag','id','createdAt','updatedAt']);
function searchableText(it){
  const parts = [];
  for(const k in it){
    if(NON_SEARCHABLE_FIELDS.has(k)) continue;
    const v = it[k];
    if(v===undefined || v===null) continue;
    parts.push(typeof v==='string' ? v : JSON.stringify(v));
  }
  return parts.join(' ').toLowerCase();
}
function filterItems(key, items){
  const f = activeFilters[key]; if(!f) return items;
  return items.filter(it=>{
    for(const k in f){
      if(!f[k]) continue;
      if(k==='__q'){ if(!searchableText(it).includes(f[k].toLowerCase())) return false; }
      else if(it[k]!==f[k]) return false;
    }
    return true;
  });
}

/* ================= WRITING MODE ==================================================
   Additive feature: writes ONLY to chapter.novelText, a new optional field on existing
   STATE.chapters items. No new STATE key, no CFG.chapters change, no IndexedDB/schema
   change — chapter.novelText rides along with the rest of the chapter object through the
   existing queueSave('chapters') / buildProjectDump() / handleImportFile() paths untouched.

   UI-only module state below (writingActiveId / writingPreviewMode / writingFocusMode) is
   never persisted — same pattern as the existing `currentView`/`subTab` module variables.
   ================================================================================== */
let writingActiveId = null;
let writingPreviewMode = false;
let writingFocusMode = false;

/* ---- debounced, chapter-safe autosave -----------------------------------------------
   Design: each input event captures (chapterId, html) together in a closure and stores
   them in pendingWritingChapterId/pendingWritingHtml. The debounced commit NEVER reads the
   live editor DOM (it may be long gone by the time the timer fires — e.g. after switching
   chapters or leaving Writing Mode) — it only ever writes the exact (chapterId, html) pair
   captured at input time, and only if that chapter still exists in STATE.chapters. This
   guarantees a save can never land on the wrong chapter, regardless of what the user does
   in the UI while the debounce is pending. */
let writingSaveTimer = null;
let pendingWritingChapterId = null;
let pendingWritingHtml = null;

function scheduleWritingSave(chapterId, html){
  pendingWritingChapterId = chapterId;
  pendingWritingHtml = html;
  clearTimeout(writingSaveTimer);
  writingSaveTimer = setTimeout(commitPendingWritingSave, 600);
}
function commitPendingWritingSave(){
  writingSaveTimer = null;
  if(pendingWritingChapterId==null) return;
  const idx = STATE.chapters.findIndex(c=>c.id===pendingWritingChapterId);
  if(idx>-1){ /* chapter still exists (not deleted/trashed meanwhile) — safe to write */
    STATE.chapters[idx].novelText = pendingWritingHtml;
    queueSave('chapters');
  }
  pendingWritingChapterId = null;
  pendingWritingHtml = null;
}
/* Called before any action that would otherwise discard the pending edit (switching
   chapters, leaving Writing Mode via go()) — commits immediately instead of waiting out
   the debounce, so a fast chapter-switch can never lose the last keystrokes. Intentionally
   NOT called by toggleWritingPreview(): entering/leaving Preview must never trigger a save
   by itself. The pending timer (if any) keeps running in the background regardless and will
   still commit correctly on its own schedule — Preview just displays STATE as of the last
   commit in the meantime. */
function flushPendingWritingSave(){
  if(writingSaveTimer){ clearTimeout(writingSaveTimer); commitPendingWritingSave(); }
}

/* Pure function, no STATE mutation — reuses the existing stripHtml() helper rather than
   duplicating HTML-to-text logic. */
function writingCountStats(html){
  const text = stripHtml(html);
  const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
  return {words, chars: text.length};
}

/* Rebuilds ONLY the main editor/preview pane (never the sidebar or reference panel).
   Called on initial load (via renderWritingSub) and on Preview toggle. Deliberately never
   called from an input handler — the live editor DOM is left alone while the user types;
   only the word/char counters are patched directly (see below). */
function renderWritingMainArea(){
  const mainEl = document.getElementById('writingMain');
  if(!mainEl) return;
  const chapter = STATE.chapters.find(c=>c.id===writingActiveId);
  if(!chapter){ mainEl.innerHTML = `<div class="empty-state">لا يوجد فصل محدد.</div>`; return; }

  const stats = writingCountStats(chapter.novelText||'');
  const totalWords = STATE.chapters.reduce((sum,c)=> sum + writingCountStats(c.novelText||'').words, 0);

  if(writingPreviewMode){
    /* Read-only: displays chapter.novelText exactly as stored — no sanitizing, no
       reformatting, not editable, and reaching this branch never itself triggers a save. */
    mainEl.innerHTML = `
      <div class="writing-chapter-head"><span class="wch-badge">${esc(chapter.title||'')}</span></div>
      <div class="writing-preview rte-editor big" style="cursor:default;">${chapter.novelText || '<span style="color:var(--muted-2);">لا يوجد نص مكتوب بعد لهذا الفصل.</span>'}</div>
      <div class="writing-stats">
        <span>كلمات الفصل: <b>${stats.words}</b></span>
        <span>الأحرف: <b>${stats.chars}</b></span>
        <span>إجمالي الرواية: <b>${totalWords}</b> كلمة</span>
      </div>`;
    return;
  }

  const editorId = 'writingEditor_'+chapter.id;
  mainEl.innerHTML = `
    <div class="writing-chapter-head"><span class="wch-badge">${esc(chapter.title||'')}</span></div>
    ${richTextFieldHtml(editorId, chapter.novelText||'', 'ابدأ الكتابة هنا...', true)}
    <div class="writing-stats">
      <span id="writingWordCount">كلمات الفصل: <b>${stats.words}</b></span>
      <span id="writingCharCount">الأحرف: <b>${stats.chars}</b></span>
      <span id="writingTotalCount">إجمالي الرواية: <b>${totalWords}</b> كلمة</span>
    </div>`;

  const editorEl = document.getElementById(editorId);
  if(editorEl){
    const boundChapterId = chapter.id; /* captured once per editor instance — this is the
      chapter this exact DOM node belongs to, for as long as it lives */
    editorEl.addEventListener('input', ()=>{
      const html = editorEl.innerHTML;
      scheduleWritingSave(boundChapterId, html);
      const s = writingCountStats(html);
      const wEl = document.getElementById('writingWordCount');
      const cEl = document.getElementById('writingCharCount');
      if(wEl) wEl.innerHTML = `كلمات الفصل: <b>${s.words}</b>`;
      if(cEl) cEl.innerHTML = `الأحرف: <b>${s.chars}</b>`;
    });
  }
}

/* Read-only reference panel — displays existing v17 planning fields (goal/summary/scenes)
   for the active chapter. Pure display; does not read or write novelText, adds no new
   STATE field, and never triggers a save. */
function renderWritingRef(){
  const el = document.getElementById('writingRef');
  if(!el) return;
  const chapter = STATE.chapters.find(c=>c.id===writingActiveId);
  if(!chapter){ el.innerHTML=''; return; }
  const relatedScenes = STATE.scenes.filter(s=>s.chapterId===chapter.id);
  el.innerHTML = `
    <div class="writing-ref-block"><h4>🎯 هدف الفصل</h4><p>${esc(chapter.goal||'لم يُحدد بعد.')}</p></div>

/* Switching chapters ALWAYS flushes any pending edit first — the last keystrokes in the
   chapter being left are committed (or safely queued to commit) before writingActiveId
   changes, so a fast click to another chapter can never drop them. */
function selectWritingChapter(id){
  if(id===writingActiveId) return;
  flushPendingWritingSave();
  writingActiveId = id;
  renderWritingSub();
}

/* Preview toggle: intentionally does NOT flush and does NOT call queueSave — switching
   Preview on/off must never itself cause a save, per explicit requirement. Any edit made
   just before toggling is still safe: the debounced commit (if one is pending) keeps
   running independently of this UI action and will land correctly on its own. */
function toggleWritingPreview(){
  writingPreviewMode = !writingPreviewMode;
  const btn = document.getElementById('writingPreviewBtn');
  if(btn) btn.textContent = writingPreviewMode ? '📝 تحرير' : '👁️ معاينة';
  renderWritingMainArea();
}

/* Focus mode: pure CSS/UI toggle. Deliberately does NOT call render() and does NOT touch
   the editor DOM at all — the live contenteditable node (and its pending debounce closure)
   is completely undisturbed, so toggling Focus mid-typing carries zero data risk. */
function toggleWritingFocus(){
  writingFocusMode = !writingFocusMode;
  document.body.classList.toggle('writing-focus-mode', writingFocusMode);
  const btn = document.getElementById('writingFocusBtn');
  if(btn) btn.textContent = writingFocusMode ? '✕ إنهاء التركيز' : '⛶ وضع التركيز';
}

/* ---- hierarchical story tree: Saga -> Arc -> Chapter -> Scene ---- */
let treeOpenNodes = {};
function toggleTreeNode(id){
  treeOpenNodes[id] = !treeOpenNodes[id];
  const kids = document.getElementById('tc_'+id);
  const toggle = document.getElementById('tt_'+id);
  if(kids) kids.style.display = treeOpenNodes[id] ? 'block' : 'none';
  if(toggle) toggle.textContent = treeOpenNodes[id] ? '▾' : '▸';
}
function treeSceneLeaf(sc){
  return `<div class="tree-leaf" onclick="openDetail('scenes','${sc.id}')">🎬 ${esc(sc.title||'بدون اسم')}</div>`;
}
function treeChapterNode(ch){
  const scenes = STATE.scenes.filter(s=>s.chapterId===ch.id);
  const id = 'ch_'+ch.id;
  return `<div class="tree-node lvl2">
    <div class="tree-row" onclick="toggleTreeNode('${id}')">
      <span class="tree-toggle" id="tt_${id}">${treeOpenNodes[id]?'▾':'▸'}</span>
      <span class="tree-label">📄 ${esc(ch.title||'بدون اسم')}</span>
      <span class="tag">${scenes.length} مشهد</span>
      <button class="btn-ghost btn-sm tree-open-btn" onclick="event.stopPropagation();openDetail('chapters','${ch.id}')">فتح</button>
    </div>
    <div class="tree-children" id="tc_${id}" style="display:${treeOpenNodes[id]?'block':'none'};">
      ${scenes.length? scenes.map(treeSceneLeaf).join('') : '<div class="tree-empty">لا توجد مشاهد بعد</div>'}
    </div>
  </div>`;
}
function treeArcNode(arc){
  const chapters = STATE.chapters.filter(c=>c.arcId===arc.id);
  const id = 'arc_'+arc.id;
  return `<div class="tree-node lvl1">
    <div class="tree-row" onclick="toggleTreeNode('${id}')">
      <span class="tree-toggle" id="tt_${id}">${treeOpenNodes[id]?'▾':'▸'}</span>
      <span class="tree-label">🔥 ${esc(arc.name||'بدون اسم')}</span>
      <span class="tag">${chapters.length} فصل</span>
      <button class="btn-ghost btn-sm tree-open-btn" onclick="event.stopPropagation();openDetail('arcs','${arc.id}')">فتح</button>
    </div>
    <div class="tree-children" id="tc_${id}" style="display:${treeOpenNodes[id]?'block':'none'};">
      ${chapters.length? chapters.map(treeChapterNode).join('') : '<div class="tree-empty">لا توجد فصول بعد</div>'}
    </div>
  </div>`;
}
function treeSagaNode(saga){
  const arcs = STATE.arcs.filter(a=>a.sagaId===saga.id);
  const id = 'saga_'+saga.id;
  return `<div class="tree-node lvl0">
    <div class="tree-row" onclick="toggleTreeNode('${id}')">
      <span class="tree-toggle" id="tt_${id}">${treeOpenNodes[id]?'▾':'▸'}</span>
      <span class="tree-label">📚 <b>${esc(saga.name||'بدون اسم')}</b></span>
      <span class="tag">${arcs.length} أرك</span>
      <button class="btn-ghost btn-sm tree-open-btn" onclick="event.stopPropagation();openDetail('sagas','${saga.id}')">فتح</button>
    </div>
    <div class="tree-children" id="tc_${id}" style="display:${treeOpenNodes[id]?'block':'none'};">
      ${arcs.length? arcs.map(treeArcNode).join('') : '<div class="tree-empty">لا توجد أركات بعد</div>'}
    </div>
  </div>`;
}
function renderStoryTree(){
  const sagas = STATE.sagas;
  const orphanArcs = STATE.arcs.filter(a=>!a.sagaId);
  if(!sagas.length && !orphanArcs.length){
    return emptyStateHtml('sagas');
  }
  let html = `<div class="story-tree">${sagas.map(treeSagaNode).join('')}`;
  if(orphanArcs.length){
    html += `<div class="tree-node lvl0">
      <div class="tree-row" style="cursor:default;">
        <span class="tree-toggle">•</span><span class="tree-label">🔥 أركات بدون ساغا</span>
      </div>
      <div class="tree-children" style="display:block;">${orphanArcs.map(treeArcNode).join('')}</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

/* ================= STORAGE INDICATOR (navigator.storage.estimate) =================
   Display-only usage policy — NOT an enforced limit. Never blocks saves or image uploads,
   even past 95%; navigator.storage.estimate()'s quota is itself only a rough browser estimate,
   not a guaranteed ceiling. Gracefully shows an "unsupported" state instead of throwing if the
   API is missing. */
const storageEstimateState = {
  supported: (typeof navigator!=='undefined' && navigator.storage && typeof navigator.storage.estimate==='function'),
  usage: null, quota: null, error: null,
};
let storageIndicatorLastFetchAt = 0;
function formatBytesHuman(bytes){
  if(bytes==null || isNaN(bytes)) return '—';
  const mb = bytes/(1024*1024);
  if(mb < 1024) return (mb<10? mb.toFixed(1) : Math.round(mb)) + ' MB';
  return (mb/1024).toFixed(2) + ' GB';
}
function storageUsageLevel(pct){
  if(pct>=95) return {emoji:'🔴', note:'تحذير قوي — يُفضّل عمل نسخة احتياطية قبل إضافة صور جديدة'};
  if(pct>=85) return {emoji:'🟠', note:'يُفضّل عمل نسخة احتياطية'};
  if(pct>=70) return {emoji:'🟡', note:'تحذير'};
  return {emoji:'🟢', note:'طبيعي'};
}
function renderStorageIndicatorHtml(){
  if(!storageEstimateState.supported){
    return `<div class="panel" style="margin-top:14px;">
      <h3 class="sub-h">💾 التخزين</h3>
      <p class="save-hint">تقدير المساحة غير مدعوم في هذا المتصفح — الحفظ يعمل طبيعياً بدونه.</p>
    </div>`;
  }
  if(storageEstimateState.error){
    return `<div class="panel" style="margin-top:14px;">
      <h3 class="sub-h">💾 التخزين</h3>
      <p class="save-hint">تعذّر حساب مساحة التخزين حالياً.</p>
    </div>`;
  }
  const {usage, quota} = storageEstimateState;
  if(usage==null || quota==null){
    return `<div class="panel" style="margin-top:14px;">
      <h3 class="sub-h">💾 التخزين</h3>
      <p class="save-hint">جارٍ الحساب...</p>
    </div>`;
  }
  const pct = quota>0 ? Math.round((usage/quota)*100) : 0;
  const level = storageUsageLevel(pct);
  return `<div class="panel" style="margin-top:14px;">
    <h3 class="sub-h">💾 التخزين</h3>
    <p class="save-hint" style="font-size:13.5px;">${formatBytesHuman(usage)} مستخدم من حوالي ${formatBytesHuman(quota)}</p>
    <p class="save-hint" style="font-size:13.5px;">${level.emoji} الاستخدام: ${pct}% — ${level.note}</p>
  </div>`;
}
/* Fetches a fresh estimate and patches ONLY the #storageIndicatorEl container directly — never
   calls the global render() — so it never disrupts any open form elsewhere on the page. */
async function updateStorageIndicator(){
  storageIndicatorLastFetchAt = Date.now();
  if(storageEstimateState.supported){
    try{
      const est = await navigator.storage.estimate();
      storageEstimateState.usage = est.usage;
      storageEstimateState.quota = est.quota;
      storageEstimateState.error = null;
    }catch(e){
      storageEstimateState.error = e.message || String(e);
    }
  }
  const el = document.getElementById('storageIndicatorEl');
  if(el) el.innerHTML = renderStorageIndicatorHtml();
}
/* Throttled variant for call sites that may fire on every render() (e.g. the settings tab
   itself) — avoids hammering navigator.storage.estimate() on rapid re-renders. */
function maybeRefreshStorageIndicator(){
  if(Date.now() - storageIndicatorLastFetchAt < 3000) return;
  updateStorageIndicator();
}

/* generic HTML5 drag-and-drop for reorderable settings lists (desktop pointer input) */
let dragSrcIndex = null, dragSrcKey = null;
function handleDragStart(e, key, idx){
  dragSrcIndex = idx; dragSrcKey = key;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(idx)); }catch(err){}
}
function handleDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function handleDrop(e, key, idx){
  e.preventDefault();
  if(dragSrcKey !== key || dragSrcIndex===null || dragSrcIndex===idx) { dragSrcIndex=null; dragSrcKey=null; return; }
  const arr = STATE[key];
  const [moved] = arr.splice(dragSrcIndex, 1);
  arr.splice(idx, 0, moved);
  queueSave(key);
  dragSrcIndex = null; dragSrcKey = null;
  render();
}
function toggleHomeSection(key){
  STATE.homeSections[key] = STATE.homeSections[key]===false ? true : false;
  queueSave('homeSections');
  render();
}
function moveHomeSection(i, dir){
  const arr = STATE.homeSectionOrder;
  const j = i+dir;
  if(j<0 || j>=arr.length) return;
  [arr[i],arr[j]] = [arr[j],arr[i]];
  queueSave('homeSectionOrder');
  render();
}

/* ================= SUPABASE AUTH =================
   Netlify Identity was removed in Phase 3B — Supabase Auth is now the only account system.

   ⚠️ SETUP REQUIRED BEFORE THIS ACTIVATES:
   1. Create a project at https://supabase.com
   2. Project Settings → API → copy "Project URL" and the "anon public" key.
   3. Paste them into SUPABASE_URL / SUPABASE_ANON_KEY below.
   The anon key is PUBLIC/safe to embed client-side — same "no secrets in code" rule as the
   Google Drive Client ID above. NEVER paste the "service_role" key here or anywhere in this file.
   Until both values are filled in, every function below is a safe no-op and the settings panel
   shows a plain "not configured" message — same pattern as GOOGLE_CLIENT_ID.

   SCOPE OF THIS PHASE: this block ONLY manages the Auth session. It never reads
   STATE.chapters/characters/sagas/etc., never writes to a Supabase database or storage bucket
   (no such tables exist yet), and never touches IndexedDB (appState/images stores). STATE.account
   is updated here purely as a *reflection* of the current Supabase session for the existing
   settings UI to display — supabase.auth.getSession() remains the actual source of truth. */
const SUPABASE_URL = 'https://fpwzglxwfvamxcclikgs.supabase.co'; /* set — REI-SONANCE Supabase project */
const SUPABASE_ANON_KEY = 'sb_publishable_bVO2917tQnqvmeIG8AqBPw_OFhbIFgO'; /* set — publishable key "rei_sonance_app" (public/safe client-side key, NOT a secret) */
let supabaseClient = null;
let supabaseReady = false;

function supabaseConfigured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }

async function initSupabase(){
  if(!supabaseConfigured()) return; /* silent no-op — settings panel explains why */
  if(typeof window.supabase === 'undefined'){
    console.error('Supabase SDK failed to load (offline, or CDN blocked). Supabase Auth unavailable this session; app continues normally.');
    return;
  }
  try{
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    supabaseReady = true;

    /* reflect whatever session already exists (e.g. this is a page reload after a prior login) */
    const { data:{ session }, error } = await supabaseClient.auth.getSession();
    if(error) console.error('Supabase getSession error:', error);
    syncAccountFromSupabaseSession(session);

    /* keep STATE.account in sync with every future change (login/logout/token refresh) */
    supabaseClient.auth.onAuthStateChange((_event, newSession)=>{
      syncAccountFromSupabaseSession(newSession);
      render();
    });
  }catch(e){
    console.error('Supabase init failed (non-fatal — local app continues working exactly as before):', e);
  }
}

/* Reads/writes only STATE.account.loggedIn/email/userId — same shape the settings UI already
   expects. NEVER touches STATE.chapters/novel/etc. */
function syncAccountFromSupabaseSession(session){
  if(!session || !session.user){
    STATE.account.loggedIn = false;
    STATE.account.email = null;
    STATE.account.userId = null;
    queueSave('account');
    return;
  }
  const user = session.user;
  if(!STATE.account.linkedProjectOwnerId){
    STATE.account.linkedProjectOwnerId = user.id;
  }
  STATE.account.loggedIn = true;
  STATE.account.email = user.email;
  STATE.account.userId = user.id;
  queueSave('account');
}

/* ================= GOOGLE DRIVE (optional cloud backup layer) =================
   ⚠️ REQUIRES SETUP BEFORE IT CAN CONNECT TO A REAL GOOGLE ACCOUNT:
   1. Create a project at https://console.cloud.google.com
   2. Enable the "Google Drive API" for it.
   3. Configure the OAuth consent screen (External, scopes: drive.file).
   4. Create an OAuth 2.0 Client ID of type "Web application", and add your deployed
      site's exact URL (e.g. https://your-site.netlify.app) under "Authorized JavaScript origins".
   5. Paste that Client ID below. Client IDs are public/safe to embed in client-side code —
      this flow uses NO client secret (Google Identity Services token model), matching the
      "no secrets in public JS" requirement.
   Until a real Client ID is set, the Connect button shows a clear explanation instead of
   attempting (and silently failing) a real OAuth call. */
const GOOGLE_CLIENT_ID = ''; /* <-- paste your OAuth Client ID here to activate Drive sync */
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let gisTokenClient = null;
let gisAccessToken = null;
let gisScriptLoaded = false;

function isGoogleDriveConfigured(){ return !!GOOGLE_CLIENT_ID; }

function loadGisScript(){
  return new Promise((resolve, reject)=>{
    if(gisScriptLoaded){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = ()=>{ gisScriptLoaded = true; resolve(); };
    s.onerror = ()=> reject(new Error('تعذّر تحميل مكتبة Google — تحقق من الاتصال بالإنترنت.'));
    document.head.appendChild(s);
  });
}

async function connectGoogleDrive(){
  if(!isGoogleDriveConfigured()){
    showAlert(
      'ربط Google Drive يحتاج إعداد خارجي لمرة واحدة من مطوّر التطبيق (Google Cloud Project + OAuth Client ID). ' +
      'هذا الإعداد غير موجود حالياً بهذه النسخة، فالنظام المحلي (IndexedDB) هو المسؤول الكامل عن حفظ بياناتك ويعمل بدون أي قيود.',
      '☁️ Google Drive يحتاج إعداد'
    );
    return;
  }
  try{
    await loadGisScript();
    await new Promise((resolve, reject)=>{
      gisTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_DRIVE_SCOPE,
        callback: (resp)=>{
          if(resp.error){ reject(new Error(resp.error)); return; }
          gisAccessToken = resp.access_token;
          resolve();
        },
      });
      gisTokenClient.requestAccessToken();
    });
    STATE.googleDrive.connected = true;
    STATE.googleDrive.lastSyncStatus = null;
    queueSave('googleDrive');
    render();
    flashSaved();
  }catch(e){
    showAlert('تعذّر الاتصال بـ Google Drive: ' + e.message, 'خطأ بالربط');
  }
}

async function driveApiFetch(url, options){
  if(!gisAccessToken) throw new Error('غير متصل بـ Google Drive');
  const res = await fetch(url, {
    ...options,
    headers: {...(options&&options.headers||{}), 'Authorization': 'Bearer '+gisAccessToken}
  });
  if(!res.ok) throw new Error('Drive API error: '+res.status);
  return res;
}
async function ensureDriveFolder(){
  if(STATE.googleDrive.folderId) return STATE.googleDrive.folderId;
  const q = encodeURIComponent("name='REI-SONANCE Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const listRes = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const listData = await listRes.json();
  if(listData.files && listData.files.length){
    STATE.googleDrive.folderId = listData.files[0].id;
  } else {
    const createRes = await driveApiFetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:'REI-SONANCE Backups', mimeType:'application/vnd.google-apps.folder'})
    });
    const created = await createRes.json();
    STATE.googleDrive.folderId = created.id;
  }
  queueSave('googleDrive');
  return STATE.googleDrive.folderId;
}
let driveSyncTimer = null;
function queueDriveSync(){
  if(!STATE.googleDrive.connected || STATE.googleDrive.syncMode!=='auto' || !isGoogleDriveConfigured()) return;
  clearTimeout(driveSyncTimer);
  driveSyncTimer = setTimeout(()=>syncToDriveNow(), 20000); /* wait for a lull in edits, not per-keystroke */
}
async function syncToDriveNow(){
  if(!STATE.googleDrive.connected || !isGoogleDriveConfigured()) return;
  if(!navigator.onLine){
    STATE.googleDrive.lastSyncStatus = 'pending';
    queueSave('googleDrive'); render();
    return;
  }
  try{
    const folderId = await ensureDriveFolder();
    const dump = await buildProjectDump(); /* same dump builder as exportAll() — full project incl. images */
    const filename = `Backup_${new Date().toISOString().replace(/[:.]/g,'-')}.rei-project`;
    const metadata = {name: filename, parents:[folderId]};
    const boundary = 'reisonance-boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dump)}\r\n--${boundary}--`;
    await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body
    });
    await pruneOldDriveBackups(folderId);
    STATE.googleDrive.lastSyncAt = Date.now();
    STATE.googleDrive.lastSyncStatus = 'synced';
  }catch(e){
    console.error('Drive sync failed:', e);
    STATE.googleDrive.lastSyncStatus = 'failed';
    /* local project data is intentionally left untouched on any upload failure — nothing above
       this point ever wrote to STATE or appState; only lastSyncStatus below reflects the failure. */
  }
  queueSave('googleDrive'); render();
}
async function pruneOldDriveBackups(folderId){
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,createdTime)&orderBy=createdTime desc`);
  const data = await res.json();
  const files = data.files || [];
  const KEEP = 5;
  for(const f of files.slice(KEEP)){
    try{ await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, {method:'DELETE'}); }catch(e){}
  }
}
async function listDriveBackups(){
  const folderId = await ensureDriveFolder();
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,createdTime)&orderBy=createdTime desc`);
  const data = await res.json();
  return data.files || [];
}
async function restoreFromDriveBackup(fileId){
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const text = await res.text();
  const check = validateBackupData(text);
  if(!check.ok){ showAlert('⚠️ نسخة Google Drive غير صالحة أو تالفة.\n\n'+check.reason, 'خطأ بالاستعادة'); return; }
  showConfirm({
    title:'استعادة من Google Drive؟', danger:true, confirmLabel:'استعادة',
    message:'سيتم استبدال بيانات المشروع الحالية بهذه النسخة السحابية.',
    async onConfirm(){
      const result = await applyImportedProjectData(check.data); /* same safe commit path as local Import — images stored+verified before STATE is touched */
      if(!result.ok){
        showAlert('⚠️ ' + result.reason, 'خطأ بالاستعادة');
        return; /* current project + STATE fully untouched */
      }
      showAlert('تم استعادة المشروع من Google Drive بنجاح.', '✓ تم');
      go('home');
    }
  });
}

function validateBackupData(raw){
  /* Returns {ok:true, data} or {ok:false, reason}. Never mutates app state. */
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ return {ok:false, reason:'الملف ليس بصيغة JSON صالحة.'}; }
  if(!data || typeof data !== 'object' || Array.isArray(data)){
    return {ok:false, reason:'محتوى الملف غير متوقع.'};
  }
  const knownKeys = Object.keys(DEFAULTS);
  const overlap = knownKeys.filter(k => data[k] !== undefined);
  if(overlap.length === 0){
    return {ok:false, reason:'هذا الملف لا يحتوي على أي بيانات تشبه مشروع REI-SONANCE.'};
  }
  if(data.schemaVersion !== undefined && typeof data.schemaVersion === 'number' && data.schemaVersion > SCHEMA_VERSION){
    return {ok:false, reason:`هذا الملف من إصدار أحدث من التطبيق الحالي (schemaVersion ${data.schemaVersion} > ${SCHEMA_VERSION}). حدّث التطبيق أولاً قبل الاستيراد.`};
  }
  /* If the file's data references migrated imageIds (new-format export), it MUST carry a matching
     `images` entry for every single one — checked here, before the user is even asked to confirm,
     so a truncated/corrupted "new format" file is caught up front. Legacy v17 files (base64 inline,
     no imageId references yet) pass this trivially since collectReferencedImageIds finds none. */
  const imgCheck = validateImageCompleteness(data);
  if(!imgCheck.ok) return {ok:false, reason: imgCheck.reason};
  return {ok:true, data};
}
function handleImportFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const check = validateBackupData(e.target.result);
    input.value = '';
    if(!check.ok){
      showAlert('⚠️ ملف المشروع غير صالح أو تالف.\n\n' + check.reason, 'خطأ بالاستيراد');
      return; /* current project untouched */
    }
    const data = check.data;
    showConfirm({
      title:'استيراد مشروع جديد؟', danger:true, confirmLabel:'استيراد المشروع',
      message:'سيتم استبدال بيانات المشروع الحالية بالكامل بالبيانات الموجودة في هذه النسخة الاحتياطية' + (data.exportedAt? ` (بتاريخ ${new Date(data.exportedAt).toLocaleDateString('ar-EG')})`:'') + '. تأكد أنك صدّرت نسخة احتياطية من بياناتك الحالية إذا احتجتها لاحقاً.',
      async onConfirm(){
        const result = await applyImportedProjectData(data);
        if(!result.ok){
          showAlert('⚠️ ' + result.reason, 'خطأ بالاستيراد');
          return; /* current project + STATE fully untouched */
        }
        showAlert('تم استيراد المشروع بنجاح.', '✓ تم');
        go('home');
      }
    });
  };
  reader.onerror = ()=>{ showAlert('تعذّرت قراءة الملف من جهازك.', 'خطأ'); input.value=''; };
  reader.readAsText(file);
}
function clearAllData(){
  showConfirm({
    title:'⚠️ مسح كل البيانات', danger:true, confirmLabel:'متابعة',
    message:'سيتم حذف كل شخصياتك، أماكنك، فصولك، وكل بيانات الرواية نهائياً. هذا الإجراء لا يمكن التراجع عنه. صدّر نسخة احتياطية أولاً إن لم تكن قد فعلت.',
    onConfirm(){
      showPromptText({
        title:'تأكيد نهائي', danger:true, confirmLabel:'حذف كل شيء',
        message:'اكتب كلمة "حذف" بالضبط لتأكيد المسح النهائي:',
        placeholder:'حذف',
        onConfirm(typed){
          if(typed !== 'حذف'){ showAlert('لم تتم كتابة الكلمة بشكل صحيح، تم إلغاء العملية.', 'تم الإلغاء'); return; }
          STATE = JSON.parse(JSON.stringify(DEFAULTS));
          Object.keys(DEFAULTS).forEach(k=>queueSave(k));
          applyTheme('rei'); applyFontSize('medium'); applyDensity('comfortable');
          go('home');
        }
      });
    }
  });
}

function render(){
  const root = document.getElementById('pageRoot');
  if(currentView==='home') root.innerHTML = renderHome();
  else if(currentView==='world'){ root.innerHTML = renderWorldPage(); renderWorldSub(); }
  else if(currentView==='characters'){ root.innerHTML = renderCharactersPage(); renderCharList(); }
  else if(currentView==='power'){ root.innerHTML = renderPowerPage(); renderPowerSub(); }
  else if(currentView==='story'){ root.innerHTML = renderStoryPage(); renderStorySub(); }
  else if(currentView==='writing'){ root.innerHTML = renderWritingPage(); renderWritingSub(); }
  else if(currentView==='places'){ root.innerHTML = renderSimplePage('الأماكن','🗺️','places'); renderGenericList('places'); }
  else if(currentView==='history'){ root.innerHTML = renderHistoryPage(); }
  else if(currentView==='designs'){ root.innerHTML = renderDesignsPage(); }
  else if(currentView==='ideas'){ root.innerHTML = renderSimplePage('الأفكار','💡','ideas'); renderGenericList('ideas'); }
  else if(currentView==='guide'){ root.innerHTML = renderGuidePage(); bindGuideTextareas(); }
  else if(currentView==='quicknotes'){ root.innerHTML = renderQuickNotesPage(); }
  else if(currentView==='checklist'){ root.innerHTML = renderChecklistPage(); }
  else if(currentView==='schedule'){ root.innerHTML = renderSchedulePage(); }
  else if(currentView==='stats'){ root.innerHTML = renderStatsPage(); }
  else if(currentView==='links'){ root.innerHTML = renderSimplePage('روابط ومراجع','🔗','links'); renderGenericList('links'); }
  else if(currentView==='settings'){ root.innerHTML = renderSettingsPage(); }
  renderDash();
  renderBannerLogo();
}

document.addEventListener('click', e=>{
  if(!e.target.closest('.searchbox')) document.getElementById('searchResults').classList.remove('show');
  if(!e.target.closest('.cdd')) document.querySelectorAll('.cdd.open').forEach(el=>el.classList.remove('open'));
});

/* ================= INIT ================= */
(async function init(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sw.js not deployed alongside this file — app still works fully online */ });
  }
  initSupabase(); /* fire-and-forget, never blocks or touches the local data pipeline below */
  document.getElementById('pageRoot').innerHTML = '<div class="page-body"><div class="empty-state">جارِ التحميل...</div></div>';
  try{
    const migrationResult = await migrateLegacyDataToIDB();
    if(migrationResult && migrationResult.ran && migrationResult.migratedKeys.length){
      console.log('REI-SONANCE: migrated', migrationResult.migratedKeys.length, 'keys from legacy storage to IndexedDB:', migrationResult.migratedKeys.join(', '));
    }
  }catch(e){ console.error('Migration check failed (non-fatal, continuing with normal load):', e); }
  await loadAll();
  if(STATE.mode && STATE.mode!=='dark'){ applyMode(); } else { applyTheme(STATE.theme || 'rei'); }
  applyFontSize(STATE.fontSize || 'medium');
  applyDensity(STATE.density || 'comfortable');
  ensureQuickAccessItems();
  lbSetup();
  if(STATE.interfaceSettings && STATE.interfaceSettings.openLastPage && STATE.lastView){
    currentView = STATE.lastView;
  }
  if(STATE.searchSettings && STATE.searchSettings.rememberLast && STATE.lastSearch){
    const box = document.getElementById('globalSearch');
    if(box) box.value = STATE.lastSearch;
  }
  renderNav();
  render();
  updateStorageIndicator();
})();
</script>
